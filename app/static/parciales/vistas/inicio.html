    <!-- ============ INICIO ============ -->
    <section data-vista="inicio" x-show="view==='inicio'" class="space-y-6">
      <!-- portada -->
      <div class="hero">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <p class="eyebrow !text-white/70" x-text="(params.empresa || 'Tripoliven, C.A.') + ' · Ejercicio ' + ejActual.etiqueta"></p>
            <h1 class="mt-2" x-text="user.rol==='admin' ? 'Puesta en marcha' : saludo()"></h1>
            <p class="mt-2 max-w-xl text-sm sm:text-base" x-text="user.rol==='admin' ? saludo() + '. Siga los pasos en orden: cada uno se habilita cuando termina el anterior.' : user.rol==='jefe' ? 'Cargue los datos de sus indicadores y vea cómo van contra la meta.' : 'Revise lo que enviaron los jefes y analice el desempeño del ejercicio.'"></p>
          </div>
          <span class="hero-ico hidden sm:flex"><svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(user.rol==='admin' ? 'meta' : 'panel')"/></svg></span>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4" x-show="resumenInicio && resumenInicio.total">
          <template x-if="resumenInicio"><div class="hero-stat"><div class="text-xs font-semibold text-white/70">Cumplimiento</div><div class="text-3xl font-extrabold" x-text="resumenInicio.cumplimiento + '%'"></div></div></template>
          <template x-if="resumenInicio"><div class="hero-stat"><div class="text-xs font-semibold text-white/70">En verde</div><div class="text-3xl font-extrabold" x-text="resumenInicio.verde"></div></div></template>
          <template x-if="resumenInicio"><div class="hero-stat"><div class="text-xs font-semibold text-white/70">En alerta</div><div class="text-3xl font-extrabold" x-text="resumenInicio.amarillo"></div></div></template>
          <template x-if="resumenInicio"><div class="hero-stat"><div class="text-xs font-semibold text-white/70">Críticos</div><div class="text-3xl font-extrabold" x-text="resumenInicio.rojo"></div></div></template>
        </div>
      </div>

      <!-- ADMINISTRADOR: los cinco pasos -->
      <div class="space-y-3" x-show="user.rol==='admin' && marcha" data-tour="marcha">
        <div class="flex items-center justify-between px-1"><h2 class="text-lg font-extrabold">Los 5 pasos para arrancar</h2><span class="chip border-slate-200 bg-white text-slate-600" x-text="marcha ? marcha.pasos.filter(p => p.hecho).length + ' de 5 listos' : ''"></span></div>
        <template x-for="p in pasosMarcha" :key="p.id">
          <div class="paso" :class="{ 'paso-hecho': p.estado==='hecho', 'paso-ahora': p.estado==='ahora', 'paso-espera': p.estado==='espera' }">
            <span class="paso-n" x-text="p.estado==='hecho' ? '✓' : p.n"></span>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2"><h3 class="text-lg font-extrabold" x-text="p.t"></h3><span class="chip" :class="p.estado==='hecho' ? 'border-green-300 bg-green-100 text-green-800' : p.estado==='ahora' ? 'border-brand/30 bg-brand-light text-cobalt' : 'border-slate-200 bg-slate-100 text-slate-500'" x-text="p.estado==='hecho' ? 'Listo' : p.estado==='ahora' ? 'Siguiente paso' : 'Más adelante'"></span></div>
              <p class="mt-1 text-sm text-slate-600" x-text="p.d"></p>
              <p class="mt-1 text-xs font-semibold text-slate-500" x-text="p.detalle"></p>
            </div>
            <button class="btn sm:w-auto w-full" :class="p.estado==='ahora' ? 'btn-p' : 'btn-s'" :disabled="busy" @click="p.ir()"><span x-text="p.estado==='hecho' && p.id!=='periodo' ? 'Revisar' : p.b"></span><span class="text-lg">→</span></button>
          </div>
        </template>
        <div class="card border-green-200 bg-green-50" x-show="marchaCompleta"><div class="card-b flex flex-wrap items-center justify-between gap-3 text-green-900"><span class="font-bold">✔ El sistema está en marcha. Desde aquí solo queda aprobar cargas y cerrar el año.</span><button class="btn btn-p btn-sm" @click="go('bandeja')">Ir a la bandeja</button></div></div>
      </div>

      <!-- Tareas pendientes -->
      <div class="space-y-3" data-tour="inicio-tareas" x-show="tareas().length || user.rol!=='admin'">
        <h2 class="px-1 text-lg font-extrabold">Qué hacer ahora</h2>
        <template x-for="t in tareas()" :key="t.id">
          <button class="tile !flex-row !items-center" @click="irATarea(t)">
            <span class="flex h-14 min-w-[3.5rem] items-center justify-center rounded-2xl bg-amber-100 px-2 text-2xl font-extrabold text-amber-900" x-text="t.n"></span>
            <span class="min-w-0 flex-1 text-sm font-semibold" x-text="t.texto"></span>
            <span class="btn-flecha !bg-brand !text-white">→</span>
          </button>
        </template>
        <p class="card px-5 py-8 text-center text-sm font-semibold text-slate-500" x-show="!tareas().length">✔ No tiene tareas pendientes. Todo está al día.</p>
      </div>

      <!-- Secciones -->
      <div class="space-y-3">
        <h2 class="px-1 text-lg font-extrabold">Secciones</h2>
        <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <template x-for="a in accesos()" :key="a.id">
            <button class="tile" @click="go(a.id)">
              <span class="tile-ico"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(a.id)"/></svg></span>
              <span class="tile-t flex items-center gap-2"><span x-text="a.label"></span><span x-show="a.badge" class="rounded-full bg-amber-400 px-1.5 text-[11px] font-bold text-slate-900" x-text="a.badge"></span></span>
              <span class="tile-d" x-text="descripcionAcceso(a.id)"></span>
            </button>
          </template>
        </div>
      </div>
    </section>
