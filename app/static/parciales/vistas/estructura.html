    <!-- ============ ESTRUCTURA DE LA EMPRESA ============ -->
    <section data-vista="estructura" x-show="view==='estructura'" class="space-y-4">
      <div><p class="eyebrow">Quién ve qué</p><h1 class="page-title">Estructura de la empresa</h1><p class="text-sm text-slate-600">Gerencias, departamentos y jefaturas. Cada persona ve su nodo y todo lo que cuelga de él; los indicadores se asignan a un nodo. La visibilidad solo baja por el árbol.</p></div>
      <div class="card" x-show="puedeGestionarEstructura">
        <div class="card-h"><h2 class="font-semibold" x-text="tituloNodoForm"></h2><span class="flex flex-wrap gap-2"><button type="button" class="btn btn-s btn-sm" x-show="ultimoNodo && !nodoForm.id" @click="otroDelMismoNivel()" x-text="'+ ' + (ultimoNodo?.nivel === 'departamento' ? 'Otro ' : 'Otra ') + etiquetaNivel(ultimoNodo?.nivel || '').toLowerCase() + ' del mismo nivel'"></button><button type="button" class="btn btn-s btn-sm" x-show="nodoForm.id || nodoForm.padre_id" @click="nuevaGerencia()">Nueva gerencia</button></span></div>
        <form class="card-b flex flex-wrap gap-2" @submit.prevent="guardarNodo()">
          <input id="nodo-nombre" class="inp min-w-[14rem] flex-1" x-model="nodoForm.nombre" required minlength="2" maxlength="80" :placeholder="'Nombre ' + (nodoForm.id ? 'de la unidad' : nodoForm.nivel === 'departamento' ? 'del departamento' : 'de la ' + etiquetaNivel(nodoForm.nivel).toLowerCase())" aria-label="Nombre">
          <button class="btn btn-p" :disabled="busy" x-text="nodoForm.id ? 'Guardar nombre' : 'Agregar'"></button>
        </form>
      </div>
      <div class="card">
        <div class="card-h"><h2 class="font-semibold">Árbol</h2><span class="text-xs text-slate-500" x-text="arbol.length + ' nodo(s)'"></span></div>
        <ul class="divide-y divide-slate-100">
          <template x-for="n in arbol" :key="n.id"><li class="space-y-2 p-3 sm:p-4" :style="'padding-left:' + (0.75 + n.profundidad * 1.5) + 'rem'">
            <div class="flex flex-wrap items-center gap-2 sm:flex-nowrap">
              <span class="chip shrink-0 border-slate-200 bg-slate-100 text-slate-700" x-text="etiquetaNivel(n.nivel)"></span>
              <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold" x-text="n.nombre"></span><span class="block text-xs text-slate-500" x-text="n.personas + ' persona(s) · ' + n.indicadores + ' indicador(es) directos'"></span></span>
              <span class="flex w-full flex-wrap gap-1.5 sm:w-auto sm:justify-end" x-show="puedeGestionarEstructura">
                <button class="btn btn-s btn-sm" x-show="nivelSiguiente(n.nivel)" @click="nuevoHijo(n)" x-text="'+ ' + etiquetaNivel(nivelSiguiente(n.nivel))"></button>
                <button class="btn btn-s btn-sm" @click="renombrar(n)">Renombrar</button>
                <button class="btn btn-s btn-sm" x-show="puedeMover(n)" @click="abrirMover(n)" :aria-expanded="moverForm.id===n.id">Mover</button>
                <button class="btn btn-d btn-sm" @click="eliminarNodo(n)">Eliminar</button>
              </span>
            </div>
            <div class="flex flex-wrap items-center gap-2 rounded-2xl bg-slate-50 p-3" x-show="moverForm.id===n.id" x-transition>
              <label class="lbl !mb-0" :for="'mover-'+n.id">Nuevo lugar (con todo lo que cuelga de él)</label>
              <select :id="'mover-'+n.id" class="inp !w-auto min-w-[14rem]" x-model="moverForm.padre_id"><option value="">Seleccione…</option><template x-for="a in padresPosibles(n)" :key="a.id"><option :value="a.id" x-text="a.ruta"></option></template></select>
              <button class="btn btn-p btn-sm" :disabled="busy || !moverForm.padre_id" @click="confirmarMover(n)">Mover</button>
            </div>
          </li></template>
        </ul>
        <p class="p-6 text-center text-sm text-slate-500" x-show="!arbol.length">Aún no hay estructura. Empiece creando las gerencias.</p>
      </div>
    </section>
