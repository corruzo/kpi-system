    <!-- ============ PANEL DE CONTROL ============ -->
    <section data-vista="panel" x-show="view==='panel'" class="space-y-5">
      <div class="hero !p-5 sm:!p-7">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div class="min-w-0"><p class="eyebrow !text-white/70">Análisis</p><h1 class="mt-1">Panel de control</h1>
            <p class="mt-2 text-sm sm:text-base" x-text="tb ? rangoTexto : 'Cargando datos…'"></p></div>
          <div class="no-print flex flex-wrap gap-2">
            <button class="btn btn-claro btn-sm sm:hidden" @click="filtrosAbiertos=!filtrosAbiertos" :aria-expanded="filtrosAbiertos">Filtros<span class="ml-1 rounded-full bg-brand px-1.5 text-[11px] text-white" x-show="hayFiltros">●</span></button>
            <button class="btn btn-claro btn-sm" :disabled="!tb" @click="exportarCsv()">Exportar tabla (CSV)</button>
            <button class="btn btn-claro btn-sm" @click="window.print()">Imprimir</button>
          </div>
        </div>
        <!-- rangos rápidos -->
        <div class="no-print mt-5 flex flex-wrap gap-2" data-tour="panel-rangos" role="group" aria-label="Rango de fechas">
          <template x-for="p in PANEL_PRESETS" :key="p[0]"><button class="rounded-2xl px-4 py-2 text-sm font-bold ring-1 transition" :class="pf.preset===p[0] ? 'bg-white text-ink ring-white' : 'bg-white/10 text-white ring-white/25 hover:bg-white/20'" @click="aplicarPreset(p[0])" x-text="p[1]"></button></template>
        </div>
      </div>

      <!-- filtros -->
      <div class="no-print card hidden sm:block" :class="filtrosAbiertos && '!block'" data-tour="panel-filtros">
        <div class="card-b grid grid-cols-2 gap-3 lg:grid-cols-4">
          <div><label class="lbl" for="pf-desde">Desde</label><input id="pf-desde" class="inp" type="month" x-model="pf.desde" @change="cambioFiltro(true)"></div>
          <div><label class="lbl" for="pf-hasta">Hasta</label><input id="pf-hasta" class="inp" type="month" x-model="pf.hasta" @change="cambioFiltro(true)"></div>
          <div class="col-span-2 lg:col-span-1"><label class="lbl" for="pf-agrupar">Ver por</label><select id="pf-agrupar" class="inp" x-model="pf.agrupar" @change="cambioFiltro()"><template x-for="g in PANEL_GRANOS" :key="g[0]"><option :value="g[0]" x-text="g[1]"></option></template></select></div>
          <div><label class="lbl" for="pf-area">Área</label><select id="pf-area" class="inp" x-model="pf.nodo_id" @change="cambioFiltro()"><option value="">Todas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="nodoEtiqueta(a)"></option></template></select></div>
          <div><label class="lbl" for="pf-frec">Frecuencia del indicador</label><select id="pf-frec" class="inp" x-model="pf.frecuencia" @change="cambioFiltro()"><template x-for="f in PANEL_FREC" :key="f[0]"><option :value="f[0]" x-text="f[1]"></option></template></select></div>
          <div><label class="lbl" for="pf-seg">Seguimiento</label><select id="pf-seg" class="inp" x-model="pf.seguimiento" @change="cambioFiltro()"><option value="">Todos</option><option value="proceso">Desempeño de proceso</option><option value="objetivo">Objetivo organizacional</option><option value="proveedor">Proveedor externo</option></select></div>
          <div class="col-span-2"><label class="lbl" for="pf-ind">Indicador</label><select id="pf-ind" class="inp" x-model="pf.indicador_id" @change="cambioFiltro()"><option value="">Todos los indicadores</option><template x-for="i in indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select></div>
          <div class="col-span-2 flex items-end gap-3 lg:col-span-2">
            <label class="flex min-h-[52px] flex-1 cursor-pointer items-center gap-2.5 rounded-2xl border border-slate-200 bg-slate-100 px-4 text-sm font-semibold"><input type="checkbox" class="h-5 w-5 accent-brand" x-model="pf.solo_aprobadas" @change="cambioFiltro()"> Solo cargas aprobadas</label>
            <button class="btn btn-s !min-h-[52px]" @click="restablecerPanel()" :disabled="!hayFiltros && pf.preset==='ejercicio' && pf.agrupar==='mes'">Restablecer</button>
          </div>
        </div>
        <p class="border-t border-slate-100 px-5 py-3 text-xs text-slate-500 sm:px-7">Cada período de un indicador (mes, trimestre…) se ubica en la vista según el mes en que cierra. Los indicadores se miden como mínimo una vez al mes: no hay datos semanales. «Eventual» agrupa las cargas que se hacen cuando ocurre el hecho.</p>
      </div>

      <!-- cargando por primera vez -->
      <div class="grid grid-cols-2 gap-3 md:grid-cols-4" x-show="!tb && cargandoTablero" aria-hidden="true"><template x-for="n in 8" :key="n"><div class="card h-28 animate-pulse bg-slate-100"></div></template></div>

      <template x-if="tb">
      <div class="space-y-5" :class="cargandoTablero && 'opacity-60 transition'">
        <div class="card p-10 text-center" x-show="!tb.kpis.indicadores"><p class="font-semibold">No hay indicadores con estos filtros.</p><p class="mt-1 text-sm text-slate-600">Cambie el rango de fechas o quite algún filtro.</p></div>

        <template x-if="tb.kpis.indicadores">
        <div class="space-y-5">
          <!-- indicadores clave -->
          <div class="grid grid-cols-2 gap-3 md:grid-cols-4" data-tour="panel-resumen">
            <template x-for="k in kpis()" :key="k.t">
              <div class="card p-4"><div class="flex items-center gap-2"><span class="h-2.5 w-2.5 shrink-0 rounded-full" :style="'background:'+k.c"></span><span class="truncate text-xs font-bold text-slate-500" x-text="k.t"></span></div>
                <div class="mt-1.5 text-3xl font-extrabold tracking-tight" x-text="k.v"></div>
                <div class="mt-1 text-xs font-bold" x-show="k.d" :class="k.d && k.d.clase" x-text="k.d && k.d.txt"></div>
                <div class="mt-0.5 text-xs text-slate-500" :class="k.subc" x-text="k.sub"></div></div>
            </template>
          </div>

          <!-- evolución -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
            <div class="card lg:col-span-2"><div class="card-h"><div><h2>Evolución del semáforo</h2><p class="text-xs text-slate-500">Qué parte de las mediciones cumple, está en alerta o es crítica en cada período.</p></div></div><div class="card-b"><div class="h-72"><canvas id="ch-evol"></canvas></div></div></div>
            <div class="card"><div class="card-h"><div><h2>Estado actual</h2><p class="text-xs text-slate-500">Última medición de cada indicador.</p></div></div><div class="card-b"><div class="h-72"><canvas id="ch-actual"></canvas></div></div></div>
          </div>

          <!-- meta y cargas -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div class="card"><div class="card-h"><div><h2>Cumplimiento de la meta</h2><p class="text-xs text-slate-500">Períodos cuyo resultado real alcanzó la meta.</p></div></div><div class="card-b"><div class="h-72"><canvas id="ch-meta"></canvas></div>
              <p class="mt-2 text-center text-sm text-slate-500" x-show="!tb.kpis.con_meta">No hay períodos con_meta con carga en este rango.</p></div></div>
            <div class="card"><div class="card-h"><div><h2>Estado de las cargas</h2><p class="text-xs text-slate-500">Aprobadas, en revisión, devueltas y períodos que faltan por cargar.</p></div></div><div class="card-b"><div class="h-72"><canvas id="ch-carga"></canvas></div></div></div>
          </div>

          <!-- comparativo y atención -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-5">
            <div class="card lg:col-span-3"><div class="card-h flex-wrap">
              <div><h2>Comparativo</h2><p class="text-xs text-slate-500">Cómo le va a cada grupo en el rango elegido.</p></div>
              <div class="flex flex-wrap gap-2"><select class="inp !min-h-[40px] !w-auto !py-1 text-sm" x-model="pf.dimension" @change="cargarTablero()" aria-label="Agrupar por"><template x-for="d in PANEL_DIM" :key="d[0]"><option :value="d[0]" x-text="'Por ' + d[1].toLowerCase()"></option></template></select>
                <select class="inp !min-h-[40px] !w-auto !py-1 text-sm" x-model="pf.metrica" @change="dibujar()" aria-label="Medida"><option value="semaforo">Semáforo</option><option value="meta">Meta</option></select></div></div>
              <div class="card-b"><div :style="'height:' + Math.max(15, 3.4 * tb.por_dimension.length + 6) + 'rem'"><canvas id="ch-dim"></canvas></div></div></div>
            <div class="card lg:col-span-2" data-tour="panel-atencion"><div class="card-h"><h2>Requiere atención</h2><span class="chip border-slate-200 bg-slate-100 text-slate-600" x-text="tb.atencion.length"></span></div>
              <ul class="max-h-[26rem] divide-y divide-slate-100 overflow-y-auto px-2 pb-2 pt-1">
                <template x-for="a in tb.atencion" :key="a.id + a.motivo"><li><button class="flex w-full items-center gap-3 rounded-2xl px-3 py-3 text-left transition hover:bg-slate-50" @click="verFicha(a.id)">
                  <span class="h-9 w-1.5 shrink-0 rounded-full" :class="a.semaforo ? semBg(a.semaforo) : 'bg-slate-300'"></span>
                  <span class="min-w-0 flex-1"><span class="block text-xs text-slate-500" x-text="a.codigo + ' · ' + a.area"></span><span class="block truncate text-sm font-bold" x-text="a.nombre"></span><span class="block text-xs text-slate-600" x-text="a.motivo"></span></span>
                  <span class="text-lg font-extrabold" x-show="a.resultado !== null" x-text="fmt(a.resultado, a.unidad, a.decimales)"></span></button></li></template>
              </ul>
              <p class="px-6 pb-6 pt-2 text-center text-sm font-semibold text-green-700" x-show="!tb.atencion.length">✔ Sin alertas: todo en orden.</p></div>
          </div>

          <!-- tendencia y puntualidad -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
            <div class="card lg:col-span-2"><div class="card-h flex-wrap"><div><h2>Tendencia de un indicador</h2><p class="text-xs text-slate-500">Resultado contra meta, nivel óptimo y límite crítico.</p></div>
              <select class="inp !min-h-[40px] !w-full !py-1 text-sm sm:!w-auto sm:max-w-xs" x-model.number="tendInd" @change="dibujar()" aria-label="Indicador"><template x-for="i in tb.indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select></div>
              <div class="card-b"><div class="h-72" x-show="(tb.indicadores.find(i => i.id === tendInd) || {serie: []}).serie.length"><canvas id="ch-tend"></canvas></div>
                <p class="flex h-72 items-center justify-center text-sm text-slate-500" x-show="!(tb.indicadores.find(i => i.id === tendInd) || {serie: []}).serie.length">Este indicador no tiene mediciones en el rango.</p></div></div>
            <div class="card"><div class="card-h"><div><h2>Puntualidad de la carga</h2><p class="text-xs text-slate-500">Retraso promedio por responsable. Verde: 80 % o más a tiempo.</p></div></div>
              <div class="card-b"><div class="h-72" x-show="tb.responsables.length"><canvas id="ch-punt"></canvas></div><p class="flex h-72 items-center justify-center px-4 text-center text-sm text-slate-500" x-show="!tb.responsables.length">Sin cargas registradas por usuarios en el rango (las importadas desde Excel no cuentan).</p></div></div>
          </div>

          <!-- rankings -->
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
            <template x-for="r in [['Indicadores más rezagados', 'Menor % de mediciones que cumplen', peores, 'pct'], ['Mejor desempeño', 'Mayor % de mediciones que cumplen', mejores, 'pct'], ['Mayor desviación de la meta', 'Real ÷ meta más lejos de 100 %', desviados, 'meta']]" :key="r[0]">
              <div class="card"><div class="card-h"><div><h2 class="!text-lg" x-text="r[0]"></h2><p class="text-xs text-slate-500" x-text="r[1]"></p></div></div>
                <ol class="space-y-1 px-3 pb-4 pt-2">
                  <template x-for="(i, k) in r[2]" :key="i.id"><li><button class="flex w-full items-center gap-3 rounded-2xl px-3 py-2 text-left transition hover:bg-slate-50" @click="verFicha(i.id)">
                    <span class="w-5 shrink-0 text-center text-xs font-extrabold text-slate-400" x-text="k + 1"></span>
                    <span class="min-w-0 flex-1"><span class="block truncate text-sm font-bold" x-text="i.codigo + ' · ' + i.nombre"></span>
                      <span class="mt-1 block h-1.5 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full" :class="r[3]==='pct' ? 'bg-brand' : 'bg-magenta'" :style="'width:' + Math.min(100, r[3]==='pct' ? i.pct_verde : i.real_vs_meta) + '%'"></span></span></span>
                    <span class="text-sm font-extrabold" x-text="pctTxt(r[3]==='pct' ? i.pct_verde : i.real_vs_meta)"></span></button></li></template>
                </ol>
                <p class="px-6 pb-6 text-center text-sm text-slate-500" x-show="!r[2].length">Sin datos en el rango.</p></div>
            </template>
          </div>

          <!-- mapa de calor -->
          <div class="card overflow-hidden" data-tour="panel-mapa"><div class="card-h flex-wrap"><div><h2>Mapa de calor</h2><p class="text-xs text-slate-500">Semáforo de cada indicador en cada período de la vista (si hay varias mediciones, la más reciente).</p></div>
            <div class="flex gap-3 text-xs text-slate-500"><span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-green-500"></span>Cumple</span><span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-amber-400"></span>Alerta</span><span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-red-500"></span>Crítico</span></div></div>
            <div class="overflow-x-auto px-4 pb-5 sm:px-6"><table class="w-full border-separate border-spacing-1 text-xs" :style="'min-width:' + (200 + 62 * tb.serie.length) + 'px'">
              <thead><tr><th class="sticky left-0 bg-white"></th><template x-for="s in tb.serie" :key="s.codigo"><th class="pb-1 text-center font-bold text-slate-500" x-text="s.etiqueta"></th></template></tr></thead>
              <tbody><template x-for="i in tb.indicadores" :key="i.id"><tr>
                <td class="sticky left-0 max-w-[12rem] bg-white pr-3"><button class="block w-full truncate text-left font-bold hover:text-brand" @click="verFicha(i.id)" :title="i.nombre"><span class="text-slate-400" x-text="i.codigo + ' '"></span><span x-text="i.nombre"></span></button></td>
                <template x-for="s in tb.serie" :key="s.codigo"><td class="h-9 rounded-xl text-center font-bold" :class="celdaClase(i.celdas[s.codigo])" :title="i.celdas[s.codigo] ? i.celdas[s.codigo].etiqueta + ': ' + fmt(i.celdas[s.codigo].resultado, i.unidad, i.decimales) : ''" x-text="i.celdas[s.codigo] ? fmt(i.celdas[s.codigo].resultado, i.unidad, i.decimales) : ''"></td></template></tr></template></tbody></table></div></div>

          <!-- tabla completa -->
          <div class="card overflow-hidden"><div class="card-h flex-wrap"><div><h2>Todos los indicadores</h2><p class="text-xs text-slate-500">Toque un encabezado para ordenar; toque un indicador para abrir su ficha.</p></div><span class="chip border-slate-200 bg-slate-100 text-slate-600" x-text="tb.indicadores.length + ' indicadores'"></span></div>
            <div class="overflow-x-auto"><table class="w-full min-w-[860px]">
              <thead><tr>
                <template x-for="c in [['codigo','Código'],['nombre','Indicador'],['area','Área'],['frecuencia','Frecuencia'],['n','Medic.'],['pct_verde','% cumple'],['real_vs_meta','Real / meta.'],['faltantes','Sin cargar'],['ultimo','Último']]" :key="c[0]"><th class="th cursor-pointer select-none hover:text-brand" @click="ordenar(c[0])" x-text="c[1] + ' ' + flecha(c[0])"></th></template>
                <th class="th">Semáforo</th></tr></thead>
              <tbody><template x-for="i in tabla" :key="i.id"><tr class="cursor-pointer transition hover:bg-slate-50" @click="verFicha(i.id)">
                <td class="td whitespace-nowrap font-bold" x-text="i.codigo"></td><td class="td" x-text="i.nombre"></td><td class="td" x-text="i.area"></td><td class="td" x-text="cap(i.frecuencia)"></td>
                <td class="td text-center" x-text="i.n"></td><td class="td font-bold" x-text="pctTxt(i.pct_verde)"></td>
                <td class="td font-bold" :class="i.real_vs_meta === null ? '' : ((i.sentido==='mayor' ? i.real_vs_meta >= 100 : i.real_vs_meta <= 100) ? 'text-green-700' : 'text-red-700')" x-text="pctTxt(i.real_vs_meta)"></td>
                <td class="td text-center" :class="i.faltantes ? 'font-bold text-amber-700' : ''" x-text="i.faltantes"></td>
                <td class="td whitespace-nowrap"><span x-text="i.ultimo ? fmt(i.ultimo.resultado, i.unidad, i.decimales) : '—'" class="font-bold"></span><span class="block text-[11px] text-slate-500" x-text="i.ultimo ? i.ultimo.etiqueta : ''"></span></td>
                <td class="td"><span x-show="i.ultimo" class="chip border-transparent text-white" :class="semBg(i.ultimo && i.ultimo.semaforo)" x-text="semTxt(i.ultimo && i.ultimo.semaforo)"></span></td></tr></template></tbody></table></div></div>
        </div>
        </template>
      </div>
      </template>
    </section>
