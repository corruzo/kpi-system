    <!-- ============ BANDEJA ============ -->
    <section x-show="view==='bandeja'" class="mx-auto max-w-4xl space-y-4">
      <div><h1 class="page-title">Bandeja de aprobación</h1><p class="text-sm text-slate-600">Cargas enviadas por los jefes de área, pendientes de revisión.</p></div>
      <template x-for="m in bandeja" :key="m.id">
        <div class="card fade-in">
          <div class="card-h">
            <div class="min-w-0"><div class="text-xs text-slate-500" x-text="m.area + ' · ' + m.periodo_etiqueta + (m.version>1 ? ' · reenvío v'+m.version : '')"></div><div class="truncate font-semibold" x-text="m.codigo + ' · ' + m.indicador"></div></div>
            <div class="flex shrink-0 items-center gap-2"><span class="font-serif text-2xl font-medium" x-text="fmt(m.resultado, m.unidad, m.decimales)"></span><span class="chip !border-transparent !text-white" :class="semBg(m.semaforo)" x-text="semTxt(m.semaforo)"></span></div>
          </div>
          <div class="card-b space-y-4">
            <div x-html="detalleHtml(m)"></div>
            <div><label class="lbl">Nota de auditoría / motivo de devolución</label><textarea class="inp" rows="2" x-model="notas[m.id]" placeholder="Opcional al aprobar; obligatoria al devolver"></textarea></div>
            <p class="rounded-xl bg-amber-50 px-3 py-2 text-sm text-amber-900" x-show="m.cargado_por_id===user.id">Carga realizada por usted: por segregación de funciones debe revisarla otra persona.</p>
            <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
              <button class="btn btn-d" :disabled="busy || m.cargado_por_id===user.id" @click="revisar(m,'observar')">Devolver con observación</button>
              <button class="btn btn-p" :disabled="busy || m.cargado_por_id===user.id" @click="revisar(m,'aprobar')">Aprobar formalmente</button>
            </div>
          </div>
        </div>
      </template>
      <div class="card p-10 text-center text-slate-500" x-show="!bandeja.length">✔ No hay cargas pendientes de revisión.</div>
    </section>
