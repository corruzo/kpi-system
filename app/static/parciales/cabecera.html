  <header class="sticky top-0 z-30 bg-slate-50/95">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4 sm:px-6">
      <div class="flex shrink-0 items-center gap-2.5 lg:hidden">
        <img x-show="logoUrl" :src="logoUrl" alt="Logo de la empresa" class="h-9 max-w-[110px] object-contain sm:max-w-[150px]">
        <svg x-show="!logoUrl" class="h-9 w-9" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0b3558"/><path d="M8 22V12m5 10V15m5 7V9m5 13V13" stroke="#006bff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
        <div class="hidden leading-tight sm:block"><div class="text-lg font-bold">SPE TPV</div><div class="hidden text-[11px] text-slate-500 lg:block">Indicadores de gestión · ISO 9001</div></div>
      </div>
      <nav class="pill-nav mx-auto hidden min-w-0 md:flex lg:hidden" aria-label="Principal">
        <template x-for="n in nav()" :key="n.id">
          <button class="pill" :class="view===n.id && 'pill-on'" :title="n.label" :data-tour="'nav-' + n.id" @click="go(n.id)">
            <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg>
            <span :class="nav().length > 6 && view !== n.id ? 'sr-only' : ''" x-text="n.corto || n.label"></span>
            <span x-show="n.badge" class="rounded-full bg-amber-400 px-1.5 text-[11px] font-semibold text-slate-900" x-text="n.badge"></span>
          </button>
        </template>
      </nav>
      <div class="ml-auto flex items-center gap-2 md:ml-0 lg:ml-auto">
      <label class="relative" data-tour="ej-selector" x-show="ejLista.length">
        <span class="sr-only">Ejercicio fiscal</span>
        <select class="min-h-[48px] max-w-[9.5rem] cursor-pointer appearance-none rounded-2xl border border-slate-200 bg-white py-1 pl-3.5 pr-8 text-xs font-medium shadow-soft transition hover:bg-slate-100 sm:max-w-none sm:text-sm" :class="ejActual.estado==='cerrado' && 'border-amber-300 bg-amber-50 text-amber-900'" x-model.number="ejSel" @change="cambiarEjercicio()">
          <template x-for="e in ejLista" :key="e.anio"><option :value="e.anio" :selected="e.anio===ejSel" x-text="(e.estado==='cerrado' ? '🔒 ' : '') + e.etiqueta + (e.estado==='vigente' && anchoAmplio ? ' · vigente' : '')"></option></template>
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <div class="relative" @keydown.escape.window="notif.abierto = false">
        <button type="button" class="relative flex min-h-[48px] min-w-[48px] items-center justify-center rounded-2xl border border-slate-200 bg-white shadow-soft transition hover:bg-slate-100" @click="notif.abierto = !notif.abierto; if (notif.abierto) refrescarNotif()" :aria-expanded="notif.abierto" :aria-label="'Notificaciones' + (notifTotal ? ' (' + notifTotal + ' sin atender)' : '')">
          <svg class="h-5 w-5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span class="absolute -right-1 -top-1 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-red-600 px-1 text-[11px] font-bold text-white" x-show="notifTotal" x-text="notifTotal > 9 ? '9+' : notifTotal"></span>
        </button>
        <div class="fixed inset-x-3 top-20 z-50 max-h-[75vh] overflow-y-auto rounded-3xl border border-slate-200 bg-white p-3 shadow-float sm:absolute sm:inset-x-auto sm:right-0 sm:top-full sm:mt-2 sm:w-[24rem]" x-show="notif.abierto" x-cloak @click.outside="notif.abierto = false" role="dialog" aria-label="Notificaciones">
          <div class="mb-2 flex items-center justify-between gap-2 px-1"><h2 class="text-base font-bold">Notificaciones</h2><button type="button" class="text-xs font-bold text-brand disabled:opacity-40" :disabled="!notif.no_leidas" @click="marcarLeidas()">Marcar todas como leídas</button></div>
          <template x-for="a in notif.avisos" :key="'c' + a.indicador_id">
            <button type="button" class="mb-2 block w-full rounded-2xl border border-amber-300 bg-amber-50 p-3 text-left text-sm text-amber-900" @click="irAAviso(a.indicador_id)">
              <b x-text="a.dias === 0 ? 'Hoy cierra el período' : a.dias === 1 ? 'Mañana cierra el período' : 'El período cierra en ' + a.dias + ' días'"></b>
              <span class="block" x-text="a.codigo + ' · ' + a.nombre"></span>
              <span class="block text-xs" x-text="'Falta cargar: ' + a.periodos.join(', ')"></span></button>
          </template>
          <ul class="divide-y divide-slate-100">
            <template x-for="n in notif.items" :key="n.id">
              <li><button type="button" class="flex w-full gap-2.5 rounded-xl px-1.5 py-2.5 text-left text-sm transition hover:bg-slate-50" :class="!n.leida && 'bg-brand-light/60'" @click="abrirNotif(n)">
                <span class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full" :class="tipoNotifColor(n.tipo)"></span>
                <span class="min-w-0"><b class="block" :class="n.leida && 'font-semibold text-slate-600'" x-text="n.titulo"></b><span class="block whitespace-pre-line text-slate-600" x-text="n.texto"></span><span class="block text-xs text-slate-400" x-text="fecha(n.creada_en)"></span></span></button></li>
            </template>
          </ul>
          <p class="px-2 py-6 text-center text-sm text-slate-500" x-show="!notif.items.length && !notif.avisos.length">No tiene notificaciones.</p>
        </div>
      </div>
      <div class="relative">
        <button data-tour="menu-usuario" class="flex min-h-[48px] items-center gap-2.5 rounded-2xl border border-slate-200 bg-white py-1 pl-1 pr-3 shadow-soft transition hover:bg-slate-100" @click="menu=!menu" :aria-expanded="menu" aria-label="Menú de usuario">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-ink to-brand text-xs font-semibold text-white" x-text="iniciales()"></span>
          <span class="hidden text-left leading-tight lg:block"><span class="block max-w-[10rem] truncate text-sm font-medium" x-text="user.nombre.split(' (')[0]"></span><span class="block text-[11px] text-slate-500" x-text="rolNombre(user)"></span></span>
          <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="absolute right-0 mt-2 w-72 rounded-3xl border border-slate-200 bg-white p-2 shadow-float" x-show="menu" @click.outside="menu=false" x-transition>
          <div class="border-b border-slate-100 px-3 pb-3 pt-2"><div class="font-medium" x-text="user.nombre.split(' (')[0]"></div><div class="text-xs text-slate-500" x-text="rolNombre(user)"></div></div>
          <button class="mt-1 w-full rounded-xl px-3 py-3 text-left text-sm hover:bg-slate-100" @click="abrirClave()">Cambiar contraseña</button>
          <button class="w-full rounded-xl px-3 py-3 text-left text-sm hover:bg-slate-100" @click="iniciarTour()">Ver guía de uso</button>
          <button class="w-full rounded-xl px-3 py-3 text-left text-sm text-red-700 hover:bg-red-50" @click="logout()">Cerrar sesión</button>
        </div>
      </div>
      </div>
    </div>
  </header>
