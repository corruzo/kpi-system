  <header class="sticky top-0 z-30 border-b border-slate-200/70 bg-slate-50/85 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4 sm:px-6">
      <div class="flex shrink-0 items-center gap-2.5 lg:hidden">
        <img x-show="logoUrl" :src="logoUrl" alt="Logo de la empresa" class="h-9 max-w-[110px] object-contain sm:max-w-[150px]">
        <svg x-show="!logoUrl" class="h-9 w-9" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0f172a"/><path d="M8 22V12m5 10V15m5 7V9m5 13V13" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
        <div class="hidden leading-tight sm:block"><div class="font-serif text-lg font-medium">SGC • TRIPOLIVEN</div><div class="hidden text-[11px] text-slate-500 lg:block">Sistema de Gestión de la Calidad · ISO 9001</div></div>
      </div>
      <nav class="pill-nav mx-auto hidden min-w-0 md:flex lg:hidden" aria-label="Principal">
        <template x-for="n in nav()" :key="n.id">
          <button class="pill" :class="view===n.id && 'pill-on'" :title="n.label" :data-tour="'nav-' + n.id" @click="go(n.id)">
            <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg>
            <span :class="nav().length > 6 && view !== n.id ? 'sr-only' : ''" x-text="n.corto || n.label"></span>
            <span x-show="n.badge" class="rounded-full bg-amber-400 px-1.5 text-[11px] font-semibold text-slate-900" x-text="n.badge"></span>
          </button>
        </template>
      </nav>
      <div class="ml-auto flex items-center gap-2 md:ml-0 lg:ml-auto">
      <label class="relative" data-tour="ej-selector" x-show="ejLista.length">
        <span class="sr-only">Ejercicio fiscal</span>
        <select class="min-h-[44px] max-w-[9.5rem] cursor-pointer appearance-none rounded-full border border-slate-200 bg-white py-1 pl-3.5 pr-8 text-xs font-medium shadow-soft transition hover:bg-slate-100 sm:max-w-none sm:text-sm" :class="ejActual.estado==='cerrado' && 'border-amber-300 bg-amber-50 text-amber-900'" x-model.number="ejSel" @change="cambiarEjercicio()">
          <template x-for="e in ejLista" :key="e.anio"><option :value="e.anio" :selected="e.anio===ejSel" x-text="(e.estado==='cerrado' ? '🔒 ' : '') + e.etiqueta + (e.estado==='vigente' && anchoAmplio ? ' · vigente' : '')"></option></template>
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <div class="relative">
        <button data-tour="menu-usuario" class="flex min-h-[44px] items-center gap-2.5 rounded-full border border-slate-200 bg-white py-1 pl-1 pr-3 shadow-soft transition hover:bg-slate-100" @click="menu=!menu" :aria-expanded="menu" aria-label="Menú de usuario">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-900 text-xs font-semibold text-white" x-text="iniciales()"></span>
          <span class="hidden text-left leading-tight lg:block"><span class="block max-w-[10rem] truncate text-sm font-medium" x-text="user.nombre.split(' (')[0]"></span><span class="block text-[11px] text-slate-500" x-text="rolNombre(user)"></span></span>
          <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="absolute right-0 mt-2 w-72 rounded-2xl border border-slate-200 bg-white p-2 shadow-float" x-show="menu" @click.outside="menu=false" x-transition>
          <div class="border-b border-slate-100 px-3 pb-3 pt-2"><div class="font-medium" x-text="user.nombre.split(' (')[0]"></div><div class="text-xs text-slate-500" x-text="rolNombre(user) + (user.area ? ' · ' + user.area : '')"></div></div>
          <button class="mt-1 w-full rounded-xl px-3 py-2.5 text-left text-sm hover:bg-slate-100" @click="abrirClave()">Cambiar contraseña</button>
          <button class="w-full rounded-xl px-3 py-2.5 text-left text-sm hover:bg-slate-100" @click="iniciarTour()">Ver guía de uso</button>
          <button class="w-full rounded-xl px-3 py-2.5 text-left text-sm text-red-700 hover:bg-red-50" @click="logout()">Cerrar sesión</button>
        </div>
      </div>
      </div>
    </div>
  </header>
