<!-- ===================== LOGIN: solo los campos de ingreso y la advertencia de uso ===================== -->
<template x-if="!user && ready">
  <main data-vista="login" class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
    <div class="pointer-events-none absolute -left-20 top-10 h-72 w-72 rounded-full bg-cyan/20 blur-3xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -right-20 bottom-0 h-80 w-80 rounded-full bg-brand/15 blur-3xl" aria-hidden="true"></div>
    <div class="relative w-full max-w-sm">
      <form class="card space-y-5 p-6 sm:p-8" @submit.prevent="login()" novalidate>
        <h1 class="text-2xl font-extrabold tracking-tight">Iniciar sesión</h1>
        <div><label class="lbl" for="u">Usuario</label>
          <div class="relative"><svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM4 21a8 8 0 0116 0"/></svg>
            <input id="u" class="inp !pl-12" x-model.trim="loginForm.username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" autofocus required :aria-invalid="!!loginError"></div></div>
        <div><label class="lbl" for="p">Contraseña</label>
          <div class="relative"><svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11V8a6 6 0 1112 0v3M5 11h14v10H5z"/></svg>
            <input id="p" class="inp !pl-12 !pr-14" :type="verClave ? 'text' : 'password'" x-model="loginForm.password" autocomplete="current-password" maxlength="128" required :aria-invalid="!!loginError">
            <button type="button" class="absolute right-2 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-xl text-slate-500" @click="verClave=!verClave" :aria-label="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'" :aria-pressed="verClave">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path x-show="!verClave" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z"/><path x-show="verClave" d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.9 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.1 6.1A17 17 0 002 12s3.5 7 10 7a10 10 0 004.1-.9"/></svg></button></div></div>
        <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700" x-show="loginError" x-text="loginError" role="alert" aria-live="assertive"></p>
        <button class="btn btn-p btn-lg" :disabled="busy || !loginForm.username || !loginForm.password"><span x-text="busy ? 'Ingresando…' : 'Ingresar'"></span><span class="btn-flecha" aria-hidden="true">→</span></button>
      </form>
      <p class="mt-6 px-2 text-center text-xs text-slate-500">Acceso exclusivo para personal autorizado. Cada acción queda registrada en la bitácora de trazabilidad.</p>
    </div>
  </main>
</template>
