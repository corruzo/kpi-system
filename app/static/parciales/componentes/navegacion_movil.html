  <!-- navegación móvil: barra flotante -->
  <nav class="dock md:hidden" aria-label="Principal">
    <div class="grid gap-1" :style="'grid-template-columns:repeat('+navMovil().length+',minmax(0,1fr))'">
      <template x-for="n in navMovil()" :key="n.id">
        <button class="relative flex min-h-[54px] flex-col items-center justify-center gap-0.5 rounded-2xl px-1 text-[11px] font-medium transition" :class="(n.id==='_mas' ? masActivo || mas : view===n.id) ? 'bg-slate-900 text-white' : 'text-slate-500'" @click="n.id==='_mas' ? mas=!mas : go(n.id)" :aria-current="view===n.id" :data-tour="'nav-' + n.id">
          <svg class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="n.id==='_mas' ? 'M5 12h.01M12 12h.01M19 12h.01' : icono(n.id)"/></svg>
          <span class="max-w-full truncate" x-text="n.corto || n.label"></span>
          <span x-show="n.badge" class="absolute right-[18%] top-1 rounded-full bg-amber-400 px-1.5 text-[10px] font-semibold text-slate-900" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>
  <div class="fixed inset-0 z-20 md:hidden" x-show="mas" @click="mas=false" x-transition.opacity></div>
  <div class="fixed inset-x-3 bottom-[88px] z-30 rounded-3xl border border-slate-200 bg-white p-2 shadow-float md:hidden" x-show="mas" x-transition>
    <template x-for="n in navMas()" :key="n.id"><button class="flex min-h-[50px] w-full items-center gap-3 rounded-2xl px-4 text-left text-sm font-medium transition" :class="view===n.id ? 'bg-slate-100 text-slate-900' : 'text-slate-700 hover:bg-slate-50'" @click="go(n.id)">
      <svg class="h-5 w-5 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg><span class="flex-1" x-text="n.label"></span><span x-show="n.badge" class="rounded-full bg-amber-400 px-2 text-xs font-semibold text-slate-900" x-text="n.badge"></span></button></template>
  </div>
