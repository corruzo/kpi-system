  <!-- navegación móvil: barra flotante con indicador que se desliza hacia la sección activa -->
  <nav class="dock md:hidden" aria-label="Principal">
    <div class="relative grid gap-1" data-slide :style="'grid-template-columns:repeat('+navMovil().length+',minmax(0,1fr))'">
      <span class="slide-ind" aria-hidden="true"></span>
      <template x-for="n in navMovil()" :key="n.id">
        <button class="dock-item" :class="dockActivo(n) && 'dock-on'" :data-activo="dockActivo(n) ? 'true' : 'false'" @click="n.id==='_mas' ? (mas=!mas, $nextTick(() => SIGT_ANIM.indicadores())) : go(n.id)" :aria-current="view===n.id" :data-tour="'nav-' + n.id">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path :d="n.id==='_mas' ? 'M5 12h.01M12 12h.01M19 12h.01' : icono(n.id)"/></svg>
          <span class="max-w-full truncate" x-text="n.corto || n.label"></span>
          <span x-show="n.badge" class="absolute right-[14%] top-1 rounded-full bg-amber-400 px-1.5 text-[10px] font-bold text-slate-900" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>
  <div class="fixed inset-0 z-20 bg-slate-900/20 md:hidden" x-show="mas" @click="mas=false; $nextTick(() => SIGT_ANIM.indicadores())" x-transition.opacity></div>
  <div class="fixed inset-x-3 bottom-[96px] z-30 max-h-[70vh] overflow-y-auto rounded-[2rem] border border-slate-200 bg-white p-3 shadow-float md:hidden" x-show="mas" x-transition>
    <template x-for="g in navMasGrupos()" :key="g.grupo">
      <div>
        <div class="nav-grupo !pt-2" x-show="g.grupo" x-text="g.grupo"></div>
        <div class="grid grid-cols-2 gap-2">
          <template x-for="n in g.items" :key="n.id"><button class="tile !gap-2 !p-4" :class="view===n.id && '!border-brand !bg-brand-light'" @click="go(n.id)">
            <span class="tile-ico !h-10 !w-10"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg></span>
            <span class="tile-t flex items-center gap-2"><span x-text="n.label"></span><span x-show="n.badge" class="rounded-full bg-amber-400 px-1.5 text-[11px] font-bold text-slate-900" x-text="n.badge"></span></span></button></template>
        </div>
      </div>
    </template>
  </div>
