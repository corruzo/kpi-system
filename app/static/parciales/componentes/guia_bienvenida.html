  <!-- ===== Guía de bienvenida ===== -->
  <div class="fixed inset-0 z-[70]" x-show="tour.on" x-cloak @keydown.window.escape="tour.on && terminarTour()" @keydown.window.arrow-right="tour.on && pasoTour(1)" @keydown.window.arrow-left="tour.on && pasoTour(-1)" @resize.window="tour.on && mostrarPaso(tour.i)">
    <div class="absolute inset-0" @click.stop></div>
    <div class="absolute inset-0 bg-slate-900/55 backdrop-blur-[2px]" x-show="!tour.hole"></div>
    <div class="pointer-events-none absolute rounded-2xl transition-all duration-300" x-show="tour.hole" :style="tour.hole ? `top:${tour.hole.top}px;left:${tour.hole.left}px;width:${tour.hole.w}px;height:${tour.hole.h}px;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 9999px rgba(20,20,19,.55)` : ''"></div>
    <div x-ref="tourpop" class="absolute rounded-3xl border border-slate-200 bg-white p-5 shadow-float transition-all duration-300" :style="`top:${tour.pop.top}px;left:${tour.pop.left}px;width:${tour.pop.w}px`" role="dialog" aria-live="polite" aria-label="Guía de uso">
      <div class="flex items-center justify-between text-xs text-slate-500"><span x-text="'Paso ' + (tour.i + 1) + ' de ' + tour.pasos.length"></span><button class="rounded-full px-3 py-1.5 font-medium hover:bg-slate-100" @click="terminarTour()">Omitir guía</button></div>
      <h3 class="mt-2 font-serif text-xl font-medium" x-text="pasoTourActual.t"></h3>
      <p class="mt-1.5 text-sm leading-relaxed text-slate-600" x-text="pasoTourActual.d"></p>
      <div class="mt-4 flex items-center justify-between gap-2">
        <div class="flex gap-1"><template x-for="(p,k) in tour.pasos" :key="k"><span class="h-1.5 rounded-full transition-all" :class="k===tour.i ? 'w-5 bg-slate-900' : 'w-1.5 bg-slate-300'"></span></template></div>
        <div class="flex gap-2"><button class="btn btn-s btn-sm" x-show="tour.i > 0" @click="pasoTour(-1)">Atrás</button><button class="btn btn-p btn-sm" @click="pasoEsUltimo ? terminarTour() : pasoTour(1)" x-text="pasoEsUltimo ? 'Finalizar' : 'Siguiente'"></button></div>
      </div>
    </div>
  </div>
