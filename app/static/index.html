  <style>[x-cloak]{display:none!important}
  .barra-carga{animation:barra 1.1s ease-in-out infinite}@keyframes barra{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .giro{animation:giro .9s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}
  .fade-in{animation:rise .3s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  @media print{header,nav,.dock,button,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}</style>

<body x-data="sigt()" x-effect="logoUrl && (document.querySelector('link[rel=icon]').href = logoUrl)" class="min-h-screen">   <!-- el logo de la empresa también es el icono de la pestaña -->   <!-- Alpine llama solo a init(): llamarlo también con x-init lo ejecutaba dos veces (dos arranques antes de ingresar) -->

<!-- Pantalla de arranque: se ve desde el primer instante (antes de que cargue el script) y desaparece al estar lista la aplicación -->
<div class="fixed inset-0 z-[70] flex flex-col items-center justify-center gap-5 bg-slate-50" x-show="!ready && !fallaArranque" x-transition.opacity.duration.300ms role="status" aria-live="polite">
  <img x-show="logoUrl" :src="logoUrl" alt="Logo de la empresa" class="h-16 max-w-[220px] object-contain">
  <svg x-show="!logoUrl" class="h-14 w-14" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b3558"/><path d="M8 22V12m5 10V15m5 7V9m5 13V13" stroke="#006bff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
  <svg class="giro h-7 w-7 text-brand" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".2" stroke-width="3"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  <span class="text-sm font-semibold text-slate-500">Cargando…</span>
</div>
<!-- Barra de progreso: aparece si una petición tarda más de 0,2 s -->
<div class="pointer-events-none fixed inset-x-0 top-0 z-[80] h-1 overflow-hidden bg-brand/15" x-cloak x-show="cargando" x-transition.opacity role="progressbar" aria-label="Cargando"><div class="barra-carga h-full w-1/3 rounded-full bg-gradient-to-r from-brand to-cyan"></div></div>
<!-- Sin conexión -->
<div class="fixed inset-x-3 top-3 z-[75] mx-auto max-w-md rounded-2xl bg-amber-500 px-4 py-3 text-center text-sm font-bold text-slate-900 shadow-float" x-cloak x-show="sinConexion" x-transition role="alert">Sin conexión a internet. Lo que no se confirme con un aviso verde no se guardó.</div>
<!-- Falla al arrancar (servidor o base de datos no disponibles) -->
<div class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-50 p-6" x-cloak x-show="fallaArranque" role="alert">
  <div class="card w-full max-w-sm space-y-4 p-7 text-center"><h1 class="text-xl font-extrabold">No se pudo cargar el sistema</h1><p class="text-sm text-slate-600" x-text="fallaArranque"></p>
    <button class="btn btn-p btn-lg" @click="location.reload()"><span>Reintentar</span><span class="btn-flecha" aria-hidden="true">↻</span></button></div>
</div>

<div class="fixed inset-x-4 top-4 z-[60] mx-auto max-w-sm" x-cloak x-show="toast.msg" x-transition role="status">
  <div class="rounded-lg px-5 py-3 text-center text-sm font-semibold text-white shadow-float" :class="toast.error ? 'bg-red-600' : 'bg-slate-900'" x-text="toast.msg"></div>
</div>
