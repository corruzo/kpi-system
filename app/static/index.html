<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>SIGT · Tripoliven</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f172a'/><path d='M7 22V10m6 12V14m6 8V8m6 14V12' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script defer src="/static/vendor/chart.umd.js"></script>
  <script defer src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <style>[x-cloak]{display:none!important}.safe-b{padding-bottom:env(safe-area-inset-bottom)}
  .fade-in{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}</style>
</head>
<body x-data="sigt()" x-init="init()" x-cloak>

<div class="fixed inset-x-4 top-4 z-[60] mx-auto max-w-sm" x-show="toast.msg" x-transition role="status">
  <div class="rounded-lg px-4 py-3 text-sm font-medium text-white" :class="toast.error ? 'bg-red-600' : 'bg-navy'" x-text="toast.msg"></div>
</div>

<!-- ===================== LOGIN ===================== -->
<template x-if="!user && ready">
  <main class="min-h-screen md:grid md:grid-cols-2">
    <section class="bg-navy px-6 py-10 text-white md:flex md:flex-col md:justify-between md:p-14">
      <div class="flex items-center gap-3">
        <svg class="h-10 w-10" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0284c7"/><path d="M7 22V10m6 12V14m6 8V8m6 14V12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        <div><div class="text-xl font-bold leading-none">SIGT</div><div class="text-xs text-slate-300">Tripoliven, C.A.</div></div>
      </div>
      <div class="mt-8 md:mt-0">
        <h1 class="text-2xl font-bold leading-tight md:text-4xl">Sistema de Indicadores de Gestión</h1>
        <p class="mt-3 max-w-md text-slate-300">Carga, aprobación y análisis de indicadores del Sistema de Gestión de la Calidad bajo ISO 9001:2015.</p>
      </div>
      <p class="mt-8 hidden text-xs text-slate-400 md:block">Acceso exclusivo para personal autorizado. Toda acción queda registrada en la bitácora de trazabilidad.</p>
    </section>
    <section class="flex items-start justify-center px-4 py-8 md:items-center md:p-14">
      <form class="card w-full max-w-sm space-y-4 p-6" @submit.prevent="login()">
        <div><h2 class="text-xl font-bold">Iniciar sesión</h2><p class="text-sm text-slate-600">Ingrese con su usuario institucional.</p></div>
        <div><label class="lbl" for="u">Usuario</label><input id="u" class="inp" x-model="loginForm.username" autocomplete="username" autocapitalize="none" autofocus required></div>
        <div><label class="lbl" for="p">Contraseña</label><input id="p" class="inp" type="password" x-model="loginForm.password" autocomplete="current-password" required></div>
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" x-show="loginError" x-text="loginError" role="alert"></p>
        <button class="btn btn-p w-full" :disabled="busy" x-text="busy ? 'Ingresando…' : 'Ingresar'"></button>
      </form>
    </section>
  </main>
</template>

<!-- ===================== APP ===================== -->
<template x-if="user">
<div class="min-h-screen">
  <header class="sticky top-0 z-30 bg-navy text-white">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4">
      <div class="flex items-center gap-2.5">
        <svg class="h-8 w-8" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0284c7"/><path d="M7 22V10m6 12V14m6 8V8m6 14V12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        <div class="leading-tight"><div class="font-bold">SIGT</div><div class="hidden text-[11px] text-slate-300 sm:block">Tripoliven, C.A. · ISO 9001:2015</div></div>
      </div>
      <div class="relative">
        <button class="flex min-h-[44px] items-center gap-2 rounded-lg px-2 hover:bg-slate-800" @click="menu=!menu" :aria-expanded="menu" aria-label="Menú de usuario">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand text-sm font-bold" x-text="iniciales()"></span>
          <span class="hidden text-left leading-tight sm:block"><span class="block text-sm font-semibold" x-text="user.nombre"></span><span class="block text-[11px] text-slate-300" x-text="rolNombre(user) + (user.area ? ' · ' + user.area : '')"></span></span>
        </button>
        <div class="absolute right-0 mt-1 w-64 rounded-xl border border-slate-200 bg-white p-2 text-slate-900" x-show="menu" @click.outside="menu=false" x-transition>
          <div class="border-b border-slate-100 px-3 py-2 sm:hidden"><div class="text-sm font-semibold" x-text="user.nombre"></div><div class="text-xs text-slate-500" x-text="rolNombre(user) + (user.area ? ' · ' + user.area : '')"></div></div>
          <button class="w-full rounded-lg px-3 py-2.5 text-left text-sm hover:bg-slate-50" @click="abrirClave()">Cambiar contraseña</button>
          <button class="w-full rounded-lg px-3 py-2.5 text-left text-sm text-red-700 hover:bg-red-50" @click="logout()">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <!-- navegación escritorio -->
  <nav class="hidden border-b border-slate-200 bg-white md:block" aria-label="Principal">
    <div class="mx-auto flex max-w-6xl gap-1 px-4">
      <template x-for="n in nav()" :key="n.id">
        <button class="relative flex items-center gap-2 border-b-[3px] px-4 py-3.5 text-sm font-semibold" :class="view===n.id ? 'border-brand text-brand' : 'border-transparent text-slate-600 hover:text-slate-900'" @click="go(n.id)">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg>
          <span x-text="n.label"></span>
          <span x-show="n.badge" class="rounded-full bg-amber-500 px-2 text-xs font-bold text-navy" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 pb-28 pt-5 md:pb-10">

    <!-- ============ CARGA RÁPIDA ============ -->
    <section x-show="view==='carga'" class="mx-auto max-w-3xl space-y-4">
      <div><h1 class="text-2xl font-bold">Carga rápida</h1><p class="text-sm text-slate-600">Ingrese solo los datos base. El sistema calcula el resultado y el semáforo.</p></div>

      <div class="card p-8 text-center" x-show="!indicadores.length">
        <p class="font-semibold">Su área aún no tiene indicadores asignados.</p>
        <p class="mt-1 text-sm text-slate-600">Solicite al Administrador SGC que cree las fichas técnicas de su área.</p>
      </div>

      <template x-if="indicadores.length">
      <div class="space-y-4">
        <div class="card border-amber-300 bg-amber-50" x-show="pendientesTotal()" x-transition>
          <div class="card-b">
            <div class="mb-2 text-xs font-semibold uppercase tracking-wide text-amber-900">Pendientes de carga</div>
            <div class="flex flex-wrap gap-2">
              <template x-for="p in listaPendientes()" :key="p.ind.id + p.periodo">
                <button class="min-h-[40px] rounded-full border border-amber-400 bg-white px-3 text-sm text-amber-900 hover:bg-amber-100" @click="elegirPendiente(p)"><b x-text="p.ind.codigo"></b> · <span x-text="p.etiqueta"></span></button>
              </template>
            </div>
          </div>
        </div>
        <div class="card border-green-200 bg-green-50 px-4 py-3 text-sm font-medium text-green-800" x-show="!pendientesTotal()">✔ Está al día con todas sus cargas.</div>

        <div class="card">
          <div class="card-b grid gap-4 sm:grid-cols-2">
            <div>
              <label class="lbl" for="sel-ind">Indicador</label>
              <select id="sel-ind" class="inp" x-model.number="f.indicador_id" @change="cambiarIndicador()">
                <option value="">Seleccione…</option>
                <template x-for="i in indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template>
              </select>
            </div>
            <div>
              <label class="lbl" for="sel-per">Período</label>
              <select id="sel-per" class="inp" x-model="f.periodo" @change="cambiarPeriodo()" :disabled="!periodosInd.length">
                <template x-for="p in periodosInd" :key="p.periodo"><option :value="p.periodo" x-text="p.etiqueta + (p.actual ? ' (en curso)' : '') + estadoSufijo(p)"></option></template>
              </select>
            </div>
          </div>
        </div>

        <template x-if="ind">
          <div class="space-y-4 fade-in">
            <div class="card">
              <div class="card-b space-y-1 text-sm">
                <div class="font-semibold" x-text="ind.nombre"></div>
                <div class="text-slate-600" x-text="ind.objetivo"></div>
                <div class="text-xs text-slate-500 pt-1">Meta <b class="text-slate-800" x-text="umbralTxt(ind)"></b></div>
                <div class="text-xs text-slate-500">Fórmula <span class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-slate-700" x-text="formulaLegible(ind)"></span></div>
              </div>
            </div>

            <div x-show="medActual && medActual.estado!=='observado'" class="card px-4 py-3 text-sm" :class="medActual && medActual.estado==='aprobado' ? 'border-green-300 bg-green-50 text-green-900' : 'border-sky-300 bg-sky-50 text-sky-900'">
              <b x-text="medActual && medActual.estado==='aprobado' ? 'Carga aprobada.' : 'Carga enviada, en revisión.'"></b>
              <span x-text="medActual ? ' Cargada por ' + medActual.cargado_por + ' el ' + fecha(medActual.cargado_en) + '.' : ''"></span>
              <span x-show="medActual && medActual.nota_revision" x-text="' Nota: ' + (medActual && medActual.nota_revision)"></span>
            </div>
            <div x-show="medActual && medActual.estado==='observado'" class="card border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
              <b>Carga devuelta por el Gerente / Auditor.</b> Corrija y reenvíe.<br><span x-text="'Observación: ' + (medActual ? medActual.nota_revision : '')"></span>
            </div>

            <div class="card">
              <div class="card-h"><h2 class="font-semibold">Datos del período</h2></div>
              <div class="card-b grid gap-4 sm:grid-cols-2">
                <template x-for="v in ind.variables" :key="v.clave">
                  <div>
                    <label class="lbl" x-text="v.etiqueta"></label>
                    <input class="inp !text-xl !font-semibold" type="number" inputmode="decimal" step="any" min="0" :disabled="bloqueado" x-model="f.valores[v.clave]" @input.debounce.200ms="calcular()" placeholder="0">
                  </div>
                </template>
              </div>
            </div>

            <div class="card border-2 transition-colors" :class="calc && calc.ok ? semBorde(calc.semaforo) : ''" aria-live="polite">
              <div class="card-b flex items-center justify-between gap-4">
                <div>
                  <div class="text-xs font-semibold uppercase tracking-wide text-slate-500">Resultado</div>
                  <div class="text-4xl font-bold" x-text="calc && calc.ok ? fmt(calc.resultado, ind.unidad) : '—'"></div>
                  <div class="text-sm text-red-600" x-show="calc && !calc.ok && f.tocado" x-text="calc && calc.error"></div>
                </div>
                <div x-show="calc && calc.ok" class="text-right">
                  <span class="chip !px-4 !py-2 !text-sm !text-white !border-transparent" :class="semBg(calc && calc.semaforo)" x-text="semTxt(calc && calc.semaforo)"></span>
                  <div class="mt-1 text-xs text-slate-500" x-text="'Meta ' + umbralTxt(ind)"></div>
                </div>
              </div>
            </div>

            <div x-show="calc && calc.ok && calc.requiere_analisis" x-transition class="card border-amber-300 bg-amber-50">
              <div class="card-b space-y-4">
                <div class="text-sm font-semibold text-amber-900">Indicador fuera de meta: el análisis y el plan de mejora son obligatorios (ISO 9001:2015).</div>
                <div><label class="lbl">Resultados del análisis <span class="text-red-600">*</span></label><textarea class="inp" rows="3" :disabled="bloqueado" x-model="f.analisis" placeholder="¿Qué causó la desviación?"></textarea></div>
                <div><label class="lbl">Correcciones / plan de mejora <span class="text-red-600">*</span></label><textarea class="inp" rows="3" :disabled="bloqueado" x-model="f.plan_mejora" placeholder="Acciones, responsable y fecha compromiso"></textarea></div>
                <div class="text-xs text-amber-800" x-show="!bloqueado && !analisisOk()">Mínimo 10 caracteres en cada campo.</div>
              </div>
            </div>

            <button class="btn btn-p w-full sm:w-auto sm:float-right" x-show="!bloqueado" :disabled="!puedeEnviar() || busy" @click="enviar()" x-text="medActual && medActual.estado==='observado' ? 'Reenviar para revisión' : 'Enviar carga'"></button>
          </div>
        </template>
      </div>
      </template>
    </section>

    <!-- ============ HISTORIAL ============ -->
    <section x-show="view==='historial'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold" x-text="user.rol==='jefe' ? 'Mis cargas' : 'Todas las cargas'"></h1><p class="text-sm text-slate-600">Historial con valores, análisis y revisiones.</p></div>
        <a class="btn btn-s" x-show="user.rol!=='jefe'" href="/api/export/mediciones.csv">Exportar CSV</a>
      </div>
      <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        <select class="inp" x-model="filtro.indicador_id" @change="cargarHistorial()" aria-label="Filtrar por indicador"><option value="">Todos los indicadores</option><template x-for="i in indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select>
        <select class="inp" x-model="filtro.estado" @change="cargarHistorial()" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="enviado">En revisión</option><option value="aprobado">Aprobado</option><option value="observado">Devuelto</option></select>
      </div>
      <div class="space-y-3">
        <template x-for="m in historial" :key="m.id">
          <div class="card" x-data="{open:false}">
            <button class="flex w-full items-center gap-3 p-4 text-left" @click="open=!open" :aria-expanded="open">
              <span class="h-10 w-1.5 shrink-0 rounded-full" :class="semBg(m.semaforo)"></span>
              <span class="min-w-0 flex-1">
                <span class="block text-xs text-slate-500" x-text="m.codigo + ' · ' + m.periodo_etiqueta + ' · ' + m.area"></span>
                <span class="block truncate font-semibold" x-text="m.indicador"></span>
              </span>
              <span class="text-right"><span class="block text-lg font-bold" x-text="fmt(m.resultado, m.unidad)"></span><span class="chip" :class="estadoClase(m.estado)" x-text="estadoTxt(m.estado)"></span></span>
            </button>
            <div x-show="open" class="space-y-3 border-t border-slate-100 p-4" x-transition>
              <div x-html="detalleHtml(m)"></div>
              <div class="flex flex-col gap-2 sm:flex-row" x-show="user.rol==='gerente'">
                <input class="inp" x-model="notasHist[m.id]" placeholder="Agregar nota de auditoría" @keydown.enter.prevent="agregarNota(m)">
                <button class="btn btn-s whitespace-nowrap" :disabled="busy" @click="agregarNota(m)">Agregar nota</button>
              </div>
            </div>
          </div>
        </template>
        <div class="card p-8 text-center text-sm text-slate-500" x-show="!historial.length">Aún no hay cargas registradas.</div>
      </div>
    </section>

    <!-- ============ BANDEJA ============ -->
    <section x-show="view==='bandeja'" class="mx-auto max-w-4xl space-y-4">
      <div><h1 class="text-2xl font-bold">Bandeja de aprobación</h1><p class="text-sm text-slate-600">Cargas enviadas por los jefes de área, pendientes de revisión.</p></div>
      <template x-for="m in bandeja" :key="m.id">
        <div class="card fade-in">
          <div class="card-h">
            <div class="min-w-0"><div class="text-xs text-slate-500" x-text="m.area + ' · ' + m.periodo_etiqueta + (m.version>1 ? ' · reenvío v'+m.version : '')"></div><div class="truncate font-semibold" x-text="m.codigo + ' · ' + m.indicador"></div></div>
            <div class="flex shrink-0 items-center gap-2"><span class="text-xl font-bold" x-text="fmt(m.resultado, m.unidad)"></span><span class="chip !border-transparent !text-white" :class="semBg(m.semaforo)" x-text="semTxt(m.semaforo)"></span></div>
          </div>
          <div class="card-b space-y-4">
            <div x-html="detalleHtml(m)"></div>
            <div><label class="lbl">Nota de auditoría / motivo de devolución</label><textarea class="inp" rows="2" x-model="notas[m.id]" placeholder="Opcional al aprobar; obligatoria al devolver"></textarea></div>
            <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
              <button class="btn btn-d" :disabled="busy" @click="revisar(m,'observar')">Devolver con observación</button>
              <button class="btn btn-p" :disabled="busy" @click="revisar(m,'aprobar')">Aprobar formalmente</button>
            </div>
          </div>
        </div>
      </template>
      <div class="card p-10 text-center text-slate-500" x-show="!bandeja.length">✔ No hay cargas pendientes de revisión.</div>
    </section>

    <!-- ============ PANEL ============ -->
    <section x-show="view==='panel'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold">Panel de análisis</h1><p class="text-sm text-slate-600">Estado actual según la última medición de cada indicador.</p></div>
        <select class="inp !w-full sm:!w-auto" x-model="panelArea" @change="cargarPanel()" aria-label="Filtrar por área"><option value="">Todas las áreas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select>
      </div>
      <template x-if="dash && !dash.resumen.total">
        <div class="card p-10 text-center"><p class="font-semibold">Todavía no hay indicadores para analizar.</p><p class="mt-1 text-sm text-slate-600" x-text="user.rol==='admin' ? 'Cree áreas, usuarios e indicadores en las secciones de administración.' : 'El Administrador SGC debe configurar los indicadores.'"></p></div>
      </template>
      <template x-if="dash && dash.resumen.total">
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
          <template x-for="k in kpis()" :key="k.t">
            <div class="card overflow-hidden"><div class="h-1" :style="'background:'+k.c"></div><div class="p-3"><div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500" x-text="k.t"></div><div class="text-2xl font-bold" x-text="k.v"></div></div></div>
          </template>
        </div>
        <div class="grid gap-4 lg:grid-cols-3">
          <div class="card lg:col-span-2">
            <div class="card-h flex-wrap"><h2 class="font-semibold">Tendencia vs. meta</h2>
              <select class="inp !min-h-[36px] !w-full !py-1 text-sm sm:!w-auto sm:max-w-xs" x-model.number="tendInd" @change="dibujar()" aria-label="Indicador"><template x-for="i in dash.indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select></div>
            <div class="card-b"><div class="h-64 sm:h-72"><canvas id="ch-tend"></canvas></div></div>
          </div>
          <div class="card"><div class="card-h"><h2 class="font-semibold">Distribución de semáforos</h2></div><div class="card-b"><div class="h-64 sm:h-72"><canvas id="ch-dist"></canvas></div></div></div>
        </div>
        <div class="card">
          <div class="card-h"><div><h2 class="font-semibold">Cumplimiento por departamento</h2><p class="text-xs text-slate-500">% de indicadores por semáforo; la parte verde es el cumplimiento.</p></div></div>
          <div class="card-b"><div class="h-72"><canvas id="ch-area"></canvas></div></div>
        </div>
        <div class="card overflow-hidden">
          <div class="card-h"><h2 class="font-semibold">Indicadores</h2><span class="text-xs text-slate-500">Toque uno para ver su tendencia</span></div>
          <div class="hidden overflow-x-auto md:block">
            <table class="w-full"><thead><tr><th class="th">Código</th><th class="th">Indicador</th><th class="th">Área</th><th class="th">Último período</th><th class="th">Resultado</th><th class="th">Meta</th><th class="th">Semáforo</th></tr></thead>
              <tbody><template x-for="i in dash.indicadores" :key="i.id">
                <tr class="cursor-pointer hover:bg-slate-50" @click="verTendencia(i)">
                  <td class="td font-semibold" x-text="i.codigo"></td><td class="td" x-text="i.nombre"></td><td class="td" x-text="i.area"></td>
                  <td class="td"><span x-text="i.ultimo ? i.ultimo.etiqueta : '—'"></span><span x-show="i.pendiente" class="ml-1 text-xs text-amber-700">(pendiente)</span></td>
                  <td class="td font-semibold" x-text="i.ultimo ? fmt(i.ultimo.resultado, i.unidad) : '—'"></td><td class="td" x-text="umbralTxt(i)"></td>
                  <td class="td"><span x-show="i.ultimo" class="chip border-transparent text-white" :class="semBg(i.ultimo && i.ultimo.semaforo)" x-text="semTxt(i.ultimo && i.ultimo.semaforo)"></span></td>
                </tr></template></tbody></table>
          </div>
          <div class="divide-y divide-slate-100 md:hidden">
            <template x-for="i in dash.indicadores" :key="i.id">
              <button class="flex w-full items-center gap-3 p-4 text-left" @click="verTendencia(i)">
                <span class="h-10 w-1.5 shrink-0 rounded-full" :class="i.ultimo ? semBg(i.ultimo.semaforo) : 'bg-slate-300'"></span>
                <span class="min-w-0 flex-1"><span class="block text-xs text-slate-500" x-text="i.codigo + ' · ' + i.area"></span><span class="block truncate text-sm font-semibold" x-text="i.nombre"></span><span class="block text-xs text-slate-500" x-text="(i.ultimo ? i.ultimo.etiqueta : 'Sin datos') + (i.pendiente ? ' · carga pendiente' : '')"></span></span>
                <span class="text-right"><span class="block font-bold" x-text="i.ultimo ? fmt(i.ultimo.resultado, i.unidad) : '—'"></span><span class="block text-[11px] text-slate-500" x-text="umbralTxt(i)"></span></span>
              </button>
            </template>
          </div>
        </div>
      </div>
      </template>
    </section>

    <!-- ============ FICHAS ============ -->
    <section x-show="view==='fichas'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold">Fichas técnicas</h1><p class="text-sm text-slate-600">Configuración de indicadores, fórmulas y semáforos.</p></div>
        <button class="btn btn-p w-full sm:w-auto" @click="nuevaFicha()" :disabled="!areas.length">+ Nuevo indicador</button>
      </div>
      <template x-if="!setup().completo"><div class="card border-sky-300 bg-sky-50"><div class="card-b space-y-2">
        <div class="font-semibold text-sky-900">Configuración inicial</div>
        <template x-for="p in setup().pasos" :key="p.t"><button class="flex w-full items-center gap-3 rounded-lg bg-white px-3 py-2.5 text-left text-sm" @click="go(p.v)"><span class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold text-white" :class="p.ok ? 'bg-green-600' : 'bg-slate-400'" x-text="p.ok ? '✓' : p.n"></span><span class="flex-1" x-text="p.t"></span><span class="text-brand">Ir →</span></button></template>
      </div></div></template>
      <div class="card p-10 text-center text-sm text-slate-500" x-show="setup().completo && !indicadores.length">No hay indicadores. Cree el primero con «Nuevo indicador».</div>
      <div class="hidden overflow-hidden md:block" x-show="indicadores.length"><div class="card overflow-x-auto">
        <table class="w-full"><thead><tr><th class="th">Código</th><th class="th">Indicador</th><th class="th">Área</th><th class="th">Frecuencia</th><th class="th">Meta / Límite</th><th class="th">Estado</th><th class="th"></th></tr></thead>
          <tbody><template x-for="i in indicadores" :key="i.id"><tr :class="!i.activo && 'opacity-50'">
            <td class="td font-semibold" x-text="i.codigo"></td>
            <td class="td"><div x-text="i.nombre"></div><div class="font-mono text-xs text-slate-500" x-text="i.formula"></div></td>
            <td class="td" x-text="i.area"></td><td class="td" x-text="cap(i.frecuencia) + ' · ' + i.unidad"></td>
            <td class="td whitespace-nowrap" x-text="umbralTxt(i)"></td><td class="td" x-text="i.activo ? 'Activo' : 'Archivado'"></td>
            <td class="td whitespace-nowrap text-right"><button class="btn btn-s btn-sm" @click="editarFicha(i)">Editar</button> <button class="btn btn-d btn-sm" @click="eliminarFicha(i)">Eliminar</button></td></tr></template></tbody></table>
      </div></div>
      <div class="space-y-3 md:hidden">
        <template x-for="i in indicadores" :key="'m'+i.id"><div class="card" :class="!i.activo && 'opacity-60'"><div class="card-b space-y-2">
          <div class="flex items-start justify-between gap-2"><div><div class="text-xs text-slate-500" x-text="i.codigo + ' · ' + i.area"></div><div class="font-semibold" x-text="i.nombre"></div></div><span class="chip border-slate-300 text-slate-600" x-text="i.activo ? 'Activo' : 'Archivado'"></span></div>
          <div class="text-xs text-slate-500" x-text="cap(i.frecuencia) + ' · ' + i.unidad + ' · ' + umbralTxt(i)"></div>
          <div class="flex gap-2 pt-1"><button class="btn btn-s btn-sm flex-1" @click="editarFicha(i)">Editar</button><button class="btn btn-d btn-sm flex-1" @click="eliminarFicha(i)">Eliminar</button></div>
        </div></div></template>
      </div>
    </section>

    <!-- ============ ORGANIZACIÓN ============ -->
    <section x-show="view==='org'" class="space-y-4">
      <div><h1 class="text-2xl font-bold">Organización</h1><p class="text-sm text-slate-600">Áreas de la empresa y usuarios con acceso al sistema.</p></div>
      <div class="grid gap-4 lg:grid-cols-5">
        <div class="card lg:col-span-2 self-start">
          <div class="card-h"><h2 class="font-semibold">Áreas</h2><span class="text-xs text-slate-500" x-text="areas.length"></span></div>
          <div class="card-b space-y-3">
            <form class="flex gap-2" @submit.prevent="guardarArea()">
              <input class="inp" x-model="areaForm.nombre" :placeholder="areaForm.id ? 'Renombrar área' : 'Nueva área (ej. Producción)'" required minlength="2">
              <button class="btn btn-p" :disabled="busy" x-text="areaForm.id ? 'Guardar' : 'Agregar'"></button>
              <button type="button" class="btn btn-s" x-show="areaForm.id" @click="areaForm={id:null,nombre:''}">✕</button>
            </form>
            <ul class="divide-y divide-slate-100">
              <template x-for="a in areas" :key="a.id"><li class="flex items-center justify-between gap-2 py-2.5"><span class="text-sm font-medium" x-text="a.nombre"></span>
                <span class="flex gap-1"><button class="btn btn-s btn-sm" @click="areaForm={id:a.id,nombre:a.nombre}">Editar</button><button class="btn btn-d btn-sm" @click="eliminarArea(a)">Eliminar</button></span></li></template>
            </ul>
            <p class="py-4 text-center text-sm text-slate-500" x-show="!areas.length">Cree primero las áreas de la empresa.</p>
          </div>
        </div>
        <div class="card lg:col-span-3 self-start">
          <div class="card-h"><h2 class="font-semibold">Usuarios</h2><button class="btn btn-p btn-sm" @click="nuevoUsuario()">+ Nuevo usuario</button></div>
          <ul class="divide-y divide-slate-100">
            <template x-for="x in usuarios" :key="x.id"><li class="flex items-center gap-3 p-4" :class="!x.activo && 'opacity-50'">
              <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-100 text-sm font-bold text-slate-600" x-text="iniciales(x)"></span>
              <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold" x-text="x.nombre"></span><span class="block truncate text-xs text-slate-500" x-text="x.username + ' · ' + rolNombre(x) + (x.area ? ' · ' + x.area : '') + (x.activo ? '' : ' · inactivo')"></span></span>
              <button class="btn btn-s btn-sm" @click="editarUsuario(x)">Editar</button>
            </li></template>
          </ul>
        </div>
      </div>
    </section>

    <!-- ============ BITÁCORA ============ -->
    <section x-show="view==='bitacora'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold">Bitácora de trazabilidad</h1><p class="text-sm text-slate-600">Registro de solo inserción con cadena de hashes SHA-256.</p></div>
        <button class="btn btn-s" x-show="user.rol!=='jefe'" @click="verificarBitacora()">Verificar integridad</button>
      </div>
      <select class="inp sm:!w-72" x-model="bitAccion" @change="cargarBitacora()" aria-label="Filtrar por acción"><option value="">Todas las acciones</option><template x-for="a in ACCIONES" :key="a"><option :value="a" x-text="a.replaceAll('_',' ').toLowerCase()"></option></template></select>
      <div class="card hidden overflow-x-auto md:block"><table class="w-full"><thead><tr><th class="th">#</th><th class="th">Fecha</th><th class="th">Usuario</th><th class="th">Acción</th><th class="th">Detalle</th><th class="th">Hash</th></tr></thead>
        <tbody><template x-for="b in bitacora" :key="b.id"><tr>
          <td class="td text-slate-400" x-text="b.id"></td><td class="td whitespace-nowrap" x-text="fecha(b.fecha)"></td>
          <td class="td"><div x-text="b.usuario"></div><div class="text-xs text-slate-500" x-text="b.rol"></div></td>
          <td class="td"><span class="chip border-slate-200 bg-slate-100 text-slate-700" x-text="b.accion"></span></td>
          <td class="td max-w-md text-xs text-slate-700" x-text="resumenBit(b)"></td><td class="td font-mono text-xs text-slate-400" x-text="b.hash.slice(0,10)"></td></tr></template></tbody></table></div>
      <div class="space-y-3 md:hidden">
        <template x-for="b in bitacora" :key="'m'+b.id"><div class="card"><div class="card-b space-y-1.5">
          <div class="flex items-center justify-between gap-2"><span class="chip border-slate-200 bg-slate-100 text-slate-700" x-text="b.accion"></span><span class="text-xs text-slate-500" x-text="fecha(b.fecha)"></span></div>
          <div class="text-sm font-medium" x-text="b.usuario"></div><div class="break-words text-xs text-slate-600" x-text="resumenBit(b)"></div>
          <div class="font-mono text-[10px] text-slate-400" x-text="'#' + b.id + ' · ' + b.hash.slice(0,16)"></div></div></div></template>
      </div>
      <div class="card p-10 text-center text-sm text-slate-500" x-show="!bitacora.length">Sin registros.</div>
    </section>
  </main>

  <!-- navegación móvil -->
  <nav class="safe-b fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white md:hidden" aria-label="Principal">
    <div class="grid" :style="'grid-template-columns:repeat('+nav().length+',minmax(0,1fr))'">
      <template x-for="n in nav()" :key="n.id">
        <button class="relative flex min-h-[56px] flex-col items-center justify-center gap-0.5 px-1 text-[11px] font-semibold" :class="view===n.id ? 'text-brand' : 'text-slate-500'" @click="go(n.id)" :aria-current="view===n.id">
          <span class="absolute inset-x-4 top-0 h-[3px] rounded-b" :class="view===n.id && 'bg-brand'"></span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg>
          <span class="max-w-full truncate" x-text="n.corto || n.label"></span>
          <span x-show="n.badge" class="absolute right-[22%] top-1.5 rounded-full bg-amber-500 px-1.5 text-[10px] font-bold text-navy" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>

  <!-- ===== Modal: ficha ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modal" x-transition.opacity>
    <form class="card flex max-h-[92vh] w-full max-w-2xl flex-col !rounded-b-none sm:!rounded-b-xl" @submit.prevent="guardarFicha()" @keydown.escape.window="modal=false">
      <div class="card-h"><h2 class="text-lg font-bold" x-text="ficha.id ? 'Editar indicador' : 'Nuevo indicador'"></h2><button type="button" class="btn btn-s btn-sm" @click="modal=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-4 overflow-y-auto">
        <div class="grid gap-3 sm:grid-cols-3"><div><label class="lbl">Código</label><input class="inp" x-model="ficha.codigo" required></div><div class="sm:col-span-2"><label class="lbl">Nombre</label><input class="inp" x-model="ficha.nombre" required></div></div>
        <div><label class="lbl">Objetivo</label><textarea class="inp" rows="2" x-model="ficha.objetivo"></textarea></div>
        <div class="grid gap-3 sm:grid-cols-3">
          <div><label class="lbl">Área</label><select class="inp" x-model.number="ficha.area_id" required><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select></div>
          <div><label class="lbl">Unidad</label><select class="inp" x-model="ficha.unidad"><template x-for="u in ['%','días','TM','USD','cantidad']"><option x-text="u"></option></template></select></div>
          <div><label class="lbl">Frecuencia</label><select class="inp" x-model="ficha.frecuencia"><option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="semestral">Semestral</option></select></div>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <div><label class="lbl">Sentido</label><select class="inp" x-model="ficha.sentido"><option value="mayor">Mayor es mejor</option><option value="menor">Menor es mejor (inversa)</option></select></div>
          <div><label class="lbl" x-text="'Meta (verde '+(ficha.sentido==='mayor'?'≥':'≤')+')'"></label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.meta" required></div>
          <div><label class="lbl" x-text="'Límite crítico (rojo '+(ficha.sentido==='mayor'?'<':'>')+')'"></label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.limite" required></div>
        </div>
        <p class="rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-600" x-text="semaforoAyuda()"></p>
        <div>
          <label class="lbl">Variables que carga el jefe de área</label>
          <div class="space-y-2"><template x-for="(v,idx) in ficha.variables" :key="idx"><div class="grid grid-cols-[1fr_auto] gap-2 sm:grid-cols-[10rem_1fr_auto]">
            <input class="inp font-mono !text-sm sm:order-none" x-model="v.clave" placeholder="clave" pattern="[a-z][a-z0-9_]*" @input="validarFormula()" aria-label="Clave">
            <button type="button" class="btn btn-s sm:order-last" @click="ficha.variables.splice(idx,1); validarFormula()" :disabled="ficha.variables.length<2" aria-label="Quitar">✕</button>
            <input class="inp col-span-2 sm:col-span-1" x-model="v.etiqueta" placeholder="Etiqueta visible" aria-label="Etiqueta">
          </div></template></div>
          <button type="button" class="btn btn-s btn-sm mt-2" @click="ficha.variables.push({clave:'',etiqueta:''})" :disabled="ficha.variables.length>=8">+ Variable</button>
        </div>
        <div>
          <label class="lbl">Fórmula</label><input class="inp font-mono" x-model="ficha.formula" @input.debounce.300ms="validarFormula()" required>
          <div class="mt-1.5 flex flex-wrap gap-1"><template x-for="v in ficha.variables.filter(v=>v.clave)"><button type="button" class="rounded border border-slate-300 px-2 py-1 font-mono text-xs hover:bg-slate-100" @click="ficha.formula += (ficha.formula&&!ficha.formula.endsWith(' ')?' ':'')+v.clave; validarFormula()" x-text="v.clave"></button></template></div>
          <p class="mt-1 text-xs" :class="formulaMsg.ok ? 'text-green-700' : 'text-red-600'" x-text="formulaMsg.txt"></p>
        </div>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="h-5 w-5" x-model="ficha.activo"> Indicador activo</label>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modal=false">Cancelar</button><button class="btn btn-p" :disabled="busy">Guardar</button></div>
    </form>
  </div>

  <!-- ===== Modal: usuario ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modalUsuario" x-transition.opacity>
    <form class="card flex max-h-[92vh] w-full max-w-lg flex-col !rounded-b-none sm:!rounded-b-xl" @submit.prevent="guardarUsuario()" @keydown.escape.window="modalUsuario=false">
      <div class="card-h"><h2 class="text-lg font-bold" x-text="usuario.id ? 'Editar usuario' : 'Nuevo usuario'"></h2><button type="button" class="btn btn-s btn-sm" @click="modalUsuario=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-4 overflow-y-auto">
        <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl">Usuario</label><input class="inp" x-model="usuario.username" :disabled="!!usuario.id" pattern="[a-z0-9._-]{3,40}" autocapitalize="none" required><p class="mt-1 text-xs text-slate-500">Minúsculas, números, punto, guion.</p></div>
          <div><label class="lbl">Nombre completo</label><input class="inp" x-model="usuario.nombre" required minlength="3"></div></div>
        <div class="grid gap-3 sm:grid-cols-2">
          <div><label class="lbl">Rol</label><select class="inp" x-model="usuario.rol"><option value="jefe">Jefe de Área</option><option value="gerente">Gerente / Auditor SGC</option><option value="admin">Administrador SGC</option></select></div>
          <div x-show="usuario.rol==='jefe'"><label class="lbl">Área</label><select class="inp" x-model.number="usuario.area_id" :required="usuario.rol==='jefe'"><option value="">Seleccione…</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select></div>
        </div>
        <div><label class="lbl" x-text="usuario.id ? 'Nueva contraseña (opcional)' : 'Contraseña inicial'"></label><input class="inp" type="password" x-model="usuario.password" minlength="10" autocomplete="new-password" :required="!usuario.id"><p class="mt-1 text-xs text-slate-500">Mínimo 10 caracteres. Al restablecerla se cierran sus sesiones activas.</p></div>
        <label class="flex items-center gap-2 text-sm" x-show="usuario.id"><input type="checkbox" class="h-5 w-5" x-model="usuario.activo"> Usuario activo</label>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modalUsuario=false">Cancelar</button><button class="btn btn-p" :disabled="busy">Guardar</button></div>
    </form>
  </div>

  <!-- ===== Modal: contraseña ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modalClave" x-transition.opacity>
    <form class="card w-full max-w-sm !rounded-b-none sm:!rounded-b-xl" @submit.prevent="cambiarClave()" @keydown.escape.window="modalClave=false">
      <div class="card-h"><h2 class="text-lg font-bold">Cambiar contraseña</h2><button type="button" class="btn btn-s btn-sm" @click="modalClave=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-4">
        <div><label class="lbl">Contraseña actual</label><input class="inp" type="password" x-model="clave.actual" autocomplete="current-password" required></div>
        <div><label class="lbl">Nueva contraseña</label><input class="inp" type="password" x-model="clave.nueva" minlength="10" autocomplete="new-password" required></div>
        <div><label class="lbl">Repita la nueva contraseña</label><input class="inp" type="password" x-model="clave.repetir" minlength="10" autocomplete="new-password" required></div>
        <p class="text-sm text-red-600" x-show="clave.repetir && clave.nueva!==clave.repetir">Las contraseñas no coinciden.</p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modalClave=false">Cancelar</button><button class="btn btn-p" :disabled="busy || clave.nueva!==clave.repetir">Guardar</button></div>
    </form>
  </div>
</div>
</template>
</body>
</html>
