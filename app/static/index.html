          <div class="card overflow-hidden">
            <div class="bg-navy px-4 py-3 text-white"><div class="flex flex-wrap items-center justify-between gap-2"><div><div class="text-lg font-bold" x-text="fv.data.parametros.empresa"></div><div class="text-xs text-slate-300" x-text="fv.data.parametros.gerencia_emisora"></div></div>
              <div class="text-center text-sm font-bold sm:text-base">FICHA TÉCNICA DE INDICADOR DE GESTIÓN</div>
              <div class="text-right text-xs"><div class="text-slate-300">Seguimiento de:</div><div class="font-semibold" x-text="({proceso:'Desempeño de proceso',objetivo:'Objetivo organizacional',proveedor:'Desempeño de proveedor externo'})[fv.data.indicador.seguimiento]"></div></div></div></div>
            <div class="grid gap-px bg-slate-200 sm:grid-cols-2">
              <div class="bg-white p-3"><div class="lbl" x-text="fv.data.indicador.seguimiento==='objetivo' ? 'Objetivo organizacional' : 'Proceso'"></div><div class="text-sm font-semibold" x-text="fv.data.indicador.ref_nombre || '—'"></div></div>
              <div class="bg-white p-3"><div class="lbl" x-text="fv.data.indicador.seguimiento==='objetivo' ? 'Objetivo específico' : fv.data.indicador.seguimiento==='proveedor' ? 'Bien o servicio' : 'Objetivo del proceso'"></div><div class="text-sm" x-text="fv.data.indicador.ref_detalle || fv.data.indicador.objetivo || '—'"></div></div>
            </div>
          </div>

          <div class="card"><div class="card-h"><h2 class="font-semibold">Definición del indicador e información para la medición</h2></div>
            <div class="card-b grid gap-4 lg:grid-cols-3">
              <div class="space-y-3 text-sm lg:col-span-2">
                <div><div class="lbl">Nombre del indicador</div><div class="font-semibold" x-text="fv.data.indicador.nombre + (fv.data.indicador.sigla && !fv.data.indicador.nombre.includes('(' + fv.data.indicador.sigla + ')') ? ' (' + fv.data.indicador.sigla + ')' : '')"></div></div>
                <div class="grid grid-cols-3 gap-3"><div><div class="lbl">Unidad</div><div x-text="fv.data.indicador.unidad"></div></div><div><div class="lbl">Meta</div><div class="font-semibold" x-text="fv.data.indicador.meta_texto"></div></div><div><div class="lbl">Frecuencia</div><div x-text="cap(fv.data.indicador.frecuencia)"></div></div></div>
                <div><div class="lbl">Fórmula de cálculo</div><pre class="whitespace-pre-wrap break-words rounded-lg bg-slate-50 p-3 font-mono text-xs" x-text="formulaDoc(fv.data.indicador)"></pre></div>
                <div><div class="lbl">Fuente de la información</div><div x-text="fv.data.indicador.fuente || '—'"></div></div>
              </div>
              <div><div class="lbl">Semáforo (Mín. / Máx.)</div>
                <table class="w-full text-sm"><template x-for="f in semaforoFranjas(fv.data.indicador)" :key="f.c"><tr><td class="w-1/3 py-1"><span class="chip w-full justify-center border-transparent text-white" :class="semBg(f.c)" x-text="f.n"></span></td><td class="px-2 py-1 text-center" x-text="f.min || '—'"></td><td class="px-2 py-1 text-center" x-text="f.max || '—'"></td></tr></template></table>
                <div class="mt-3 text-sm"><span class="lbl">Ejercicio fiscal</span> <b x-text="fv.data.ejercicio_etiqueta"></b></div></div>
            </div></div>

          <div class="card"><div class="card-h"><h2 class="font-semibold">Responsabilidades</h2></div>
            <div class="card-b grid gap-3 text-sm sm:grid-cols-2 lg:grid-cols-3">
              <div><div class="lbl">Gerencia</div><div x-text="fv.data.indicador.gerencia || '—'"></div></div><div><div class="lbl">Departamento</div><div x-text="fv.data.indicador.area"></div></div><div><div class="lbl">Líder de proceso</div><div x-text="fv.data.indicador.lider || '—'"></div></div>
              <div><div class="lbl">Responsable de medición</div><div x-text="fv.data.indicador.resp_medicion || '—'"></div></div><div><div class="lbl">Responsable de registro</div><div x-text="fv.data.indicador.resp_registro || '—'"></div></div><div><div class="lbl">Responsable de análisis</div><div x-text="fv.data.indicador.resp_analisis || '—'"></div></div>
            </div></div>

          <div class="card overflow-hidden"><div class="card-h"><h2 class="font-semibold">Resultados de las determinaciones</h2></div>
            <div class="overflow-x-auto"><table class="w-full min-w-[640px] text-sm">
              <thead><tr><th class="th sticky left-0 bg-slate-50">Período</th><template x-for="p in fv.data.periodos" :key="p.periodo"><th class="th text-center" x-text="p.corta"></th></template></tr></thead>
              <tbody>
                <template x-for="v in fv.data.indicador.variables" :key="v.clave"><tr><td class="td sticky left-0 bg-white font-medium" x-text="v.etiqueta"></td><template x-for="p in fv.data.periodos" :key="p.periodo"><td class="td text-center" x-text="valorFicha(p, v.clave)"></td></template></tr></template>
                <tr><td class="td sticky left-0 bg-slate-50 font-bold">INDICADOR</td><template x-for="p in fv.data.periodos" :key="p.periodo"><td class="td text-center font-bold" :class="p.medicion && p.medicion.estado!=='observado' ? ({verde:'bg-green-100 text-green-800',amarillo:'bg-amber-100 text-amber-800',rojo:'bg-red-100 text-red-800'})[p.medicion.semaforo] : ''" x-text="p.medicion && p.medicion.estado!=='observado' ? fmt(p.medicion.resultado, fv.data.indicador.unidad, fv.data.indicador.decimales) : ''"></td></template></tr>
                <tr><td class="td sticky left-0 bg-white text-xs text-slate-500">Estado</td><template x-for="p in fv.data.periodos" :key="p.periodo"><td class="td text-center text-[11px] text-slate-500" x-text="p.medicion ? estadoTxt(p.medicion.estado) : ''"></td></template></tr>
              </tbody></table></div></div>

          <div class="card"><div class="card-h"><h2 class="font-semibold">Valores del indicador</h2></div><div class="card-b"><div class="h-64"><canvas id="ch-ficha"></canvas></div></div></div>

          <div class="card"><div class="card-h"><h2 class="font-semibold">Análisis y evaluación de resultados</h2></div>
            <div class="divide-y divide-slate-100">
              <template x-for="p in fv.data.periodos.filter(p => p.medicion && (p.medicion.analisis || p.medicion.plan_mejora))" :key="p.periodo"><div class="grid gap-3 p-4 text-sm lg:grid-cols-[8rem_1fr_1fr]"><div class="font-semibold" x-text="p.etiqueta"></div><div><div class="lbl">Resultados del análisis</div><div class="whitespace-pre-line" x-text="p.medicion.analisis || '—'"></div></div><div><div class="lbl">Correcciones, oportunidades o necesidades de mejora</div><div class="whitespace-pre-line" x-text="p.medicion.plan_mejora || '—'"></div></div></div></template>
              <p class="p-6 text-center text-sm text-slate-500" x-show="!fv.data.periodos.some(p => p.medicion && (p.medicion.analisis || p.medicion.plan_mejora))">Sin análisis registrados en este ejercicio.</p>
            </div></div>
          <div class="card" x-show="fv.data.indicador.notas"><div class="card-h"><h2 class="font-semibold">Notas</h2></div><div class="card-b whitespace-pre-line text-sm" x-text="fv.data.indicador.notas"></div></div>
          <p class="text-right text-xs text-slate-400" x-text="fv.data.parametros.codigo_formato"></p>
        </div>
      </template>
    </section>

    <!-- ============ IMPORTAR (administrador) ============ -->
    <section x-show="view==='importar' && user.rol==='admin'" class="mx-auto max-w-4xl space-y-4">
      <div><h1 class="text-2xl font-bold">Importar fichas históricas</h1><p class="text-sm text-slate-600">Traiga al sistema los años anteriores desde el Excel de fichas técnicas (una hoja por indicador).</p></div>
      <div class="card"><div class="card-b space-y-3">
        <p class="text-sm text-slate-700">El sistema lee cada hoja (definición, meta, semáforo, responsables, valores por período y análisis), traduce la fórmula y le muestra una <b>vista previa</b> antes de guardar. Las mediciones se importan como <b>aprobadas</b> y quedan registradas en la bitácora.</p>
        <label class="btn btn-p w-full cursor-pointer sm:w-auto"><input type="file" accept=".xlsx" class="sr-only" @change="analizarExcel($event)"><span x-text="imp.cargando ? 'Analizando…' : 'Seleccionar archivo Excel (.xlsx)'"></span></label>
      </div></div>

      <div class="card border-green-300 bg-green-50" x-show="imp.res"><div class="card-b text-sm text-green-900"><b>Importación completada:</b> <span x-text="imp.res && `${imp.res.indicadores} indicadores, ${imp.res.mediciones} mediciones, ${imp.res.areas} áreas y ${imp.res.catalogos} elementos de lista creados.`"></span>
        <div class="mt-2"><button class="btn btn-s btn-sm" @click="go('fichas')">Ir a Indicadores</button></div></div></div>

      <template x-if="imp.prev">
        <div class="space-y-4">
          <div class="card border-amber-300 bg-amber-50" x-show="impInicioDistinto"><div class="card-b text-sm text-amber-900"><b>Ejercicio fiscal distinto.</b> Las fichas inician el ejercicio en el mes <b x-text="imp.prev.inicio_ejercicio"></b> y el sistema está en el mes <b x-text="imp.prev.inicio_actual"></b>. Ajústelo en <b>Organización → Parámetros</b> antes de importar (los períodos trimestrales, semestrales, etc. dependen de él).</div></div>
          <div class="card" x-show="imp.prev.avisos.length"><div class="card-b space-y-1 text-sm text-amber-800"><template x-for="a in imp.prev.avisos"><p x-text="'• ' + a"></p></template></div></div>
          <template x-for="(i,k) in imp.prev.indicadores" :key="k">
            <div class="card" :class="!imp.sel[k] && 'opacity-60'"><div class="card-h"><label class="flex items-center gap-2 font-semibold"><input type="checkbox" class="h-5 w-5" x-model="imp.sel[k]" :disabled="!i.formula"> <span x-text="'Hoja «' + i.hoja + '»'"></span></label><span class="chip" :class="i.area_existe ? 'border-slate-300 text-slate-600' : 'border-amber-300 bg-amber-50 text-amber-800'" x-text="i.area_existe ? 'Área existente' : 'Área nueva'"></span></div>
              <div class="card-b space-y-3">
                <div class="grid gap-3 sm:grid-cols-3"><div><label class="lbl">Código</label><input class="inp" x-model="i.codigo"></div><div class="sm:col-span-2"><label class="lbl">Nombre</label><input class="inp" x-model="i.nombre"></div></div>
                <div class="grid gap-3 sm:grid-cols-3"><div><label class="lbl">Área</label><input class="inp" x-model="i.area"></div><div><label class="lbl">Frecuencia</label><select class="inp" x-model="i.frecuencia"><template x-for="f in ['mensual','bimestral','trimestral','cuatrimestral','semestral','anual','eventual']"><option :value="f" x-text="cap(f)"></option></template></select></div><div><label class="lbl">Unidad / meta</label><div class="inp !flex items-center bg-slate-50" x-text="i.unidad + ' · ' + (i.sentido==='mayor' ? '≥ ' : '≤ ') + i.meta + ' (crítico ' + i.limite + ')'"></div></div></div>
                <div><label class="lbl">Fórmula (traducida)</label><input class="inp font-mono" x-model="i.formula" placeholder="Escriba la fórmula con las claves: " :class="!i.formula && 'border-red-400'"><p class="mt-1 text-xs text-slate-500" x-text="'Variables: ' + i.variables.map(v => v.clave + ' = ' + v.etiqueta).join(' · ')"></p></div>
                <p class="text-xs text-amber-800" x-show="i.avisos.length" x-text="i.avisos.join(' ')"></p>
                <div><div class="lbl" x-text="'Mediciones a importar (' + i.mediciones.length + ') · ejercicio ' + i.ejercicio"></div>
                  <div class="flex flex-wrap gap-1.5"><template x-for="m in i.mediciones" :key="m.periodo"><span class="chip border-slate-200 bg-white text-slate-700"><span class="h-2 w-2 rounded-full" :class="semBg(m.semaforo)"></span><span x-text="m.etiqueta + ': ' + fmt(m.resultado, i.unidad, i.decimales)"></span></span></template></div></div>
              </div></div>
          </template>
          <div class="card"><div class="card-h"><h2 class="font-semibold">Listas de apoyo encontradas en el archivo</h2></div><div class="card-b space-y-2 text-sm">
            <template x-for="t in [['gerencia','Gerencias'],['proceso','Procesos'],['objetivo','Objetivos organizacionales'],['cargo','Cargos'],['area','Departamentos (se crean como áreas)']]" :key="t[0]"><label class="flex items-center gap-2" x-show="(imp.prev.catalogos[t[0]]||[]).length"><input type="checkbox" class="h-5 w-5" x-model="imp.cat[t[0]]"> <span x-text="t[1] + ' (' + imp.prev.catalogos[t[0]].length + ')'"></span></label></template>
          </div></div>
          <div class="flex flex-col gap-2 sm:flex-row sm:justify-end"><button class="btn btn-s" @click="imp.prev=null">Cancelar</button><button class="btn btn-p" :disabled="busy || !impSeleccion.length || impInicioDistinto || impSeleccion.some(i => !i.formula || !i.codigo)" @click="confirmarImportacion()" x-text="busy ? 'Importando…' : 'Importar ' + impSeleccion.length + ' indicador(es)'"></button></div>
        </div>
      </template>
    </section>

    <!-- ============ BITÁCORA (solo administrador) ============ -->
    <section x-show="view==='bitacora' && user.rol==='admin'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold">Bitácora del sistema</h1><p class="text-sm text-slate-600">Visible únicamente para el Administrador SGC. Registro de solo inserción con cadena de hashes SHA-256.</p></div>
        <div class="flex gap-2"><button class="btn btn-s" @click="verificarBitacora()">Verificar integridad</button><button class="btn btn-s" :disabled="busy" @click="descargar('/api/reportes/bitacora.xlsx','bitacora_sigt.xlsx')">Descargar Excel</button></div>
      </div>
      <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        <select class="inp" x-model="bitAccion" @change="cargarBitacora()" aria-label="Filtrar por acción"><option value="">Todas las acciones</option><template x-for="a in ACCIONES" :key="a"><option :value="a" x-text="a.replaceAll('_',' ').toLowerCase()"></option></template></select>
        <input class="inp" type="search" x-model="bitUsuario" @input.debounce.400ms="cargarBitacora()" placeholder="Buscar por usuario" aria-label="Usuario">
      </div>
      <div class="card hidden overflow-x-auto md:block"><table class="w-full"><thead><tr><th class="th">#</th><th class="th">Fecha</th><th class="th">Usuario</th><th class="th">Acción</th><th class="th">Detalle</th><th class="th">Hash</th></tr></thead>
        <tbody><template x-for="b in bitacora" :key="b.id"><tr>
          <td class="td text-slate-400" x-text="b.id"></td><td class="td whitespace-nowrap" x-text="fecha(b.fecha)"></td>
          <td class="td"><div x-text="b.usuario"></div><div class="text-xs text-slate-500" x-text="b.rol"></div></td>
          <td class="td"><span class="chip border-slate-200 bg-slate-100 text-slate-700" x-text="b.accion"></span></td>
          <td class="td max-w-md text-xs text-slate-700" x-text="resumenBit(b)"></td><td class="td font-mono text-xs text-slate-400" x-text="b.hash.slice(0,10)"></td></tr></template></tbody></table></div>
      <div class="space-y-3 md:hidden">
        <template x-for="b in bitacora" :key="'m'+b.id"><div class="card"><div class="card-b space-y-1.5">
          <div class="flex items-center justify-between gap-2"><span class="chip border-slate-200 bg-slate-100 text-slate-700" x-text="b.accion"></span><span class="text-xs text-slate-500" x-text="fecha(b.fecha)"></span></div>
          <div class="text-sm font-medium" x-text="b.usuario"></div><div class="break-words text-xs text-slate-600" x-text="resumenBit(b)"></div>
          <div class="font-mono text-[10px] text-slate-400" x-text="'#' + b.id + ' · ' + b.hash.slice(0,16)"></div></div></div></template>
      </div>
      <div class="card p-10 text-center text-sm text-slate-500" x-show="!bitacora.length">Sin registros.</div>
      <button class="btn btn-s w-full" x-show="bitMas" @click="cargarBitacora(false)">Cargar más</button>
    </section>
  </main>

  <!-- navegación móvil -->
  <nav class="safe-b fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white md:hidden" aria-label="Principal">
    <div class="grid" :style="'grid-template-columns:repeat('+navMovil().length+',minmax(0,1fr))'">
      <template x-for="n in navMovil()" :key="n.id">
        <button class="relative flex min-h-[56px] flex-col items-center justify-center gap-0.5 px-1 text-[11px] font-semibold" :class="(n.id==='_mas' ? masActivo || mas : view===n.id) ? 'text-brand' : 'text-slate-500'" @click="n.id==='_mas' ? mas=!mas : go(n.id)">
          <span class="absolute inset-x-4 top-0 h-[3px] rounded-b" :class="(n.id==='_mas' ? masActivo : view===n.id) && 'bg-brand'"></span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="n.id==='_mas' ? 'M5 12h.01M12 12h.01M19 12h.01' : icono(n.id)"/></svg>
          <span class="max-w-full truncate" x-text="n.corto || n.label"></span>
          <span x-show="n.badge" class="absolute right-[22%] top-1.5 rounded-full bg-amber-500 px-1.5 text-[10px] font-bold text-navy" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>
  <div class="fixed inset-0 z-20 md:hidden" x-show="mas" @click="mas=false" x-transition.opacity></div>
  <div class="safe-b fixed inset-x-3 bottom-[68px] z-30 rounded-xl border border-slate-200 bg-white p-2 md:hidden" x-show="mas" x-transition>
    <template x-for="n in navMas()" :key="n.id"><button class="flex min-h-[48px] w-full items-center gap-3 rounded-lg px-3 text-left text-sm font-semibold" :class="view===n.id ? 'bg-brand-light text-brand' : 'text-slate-700'" @click="go(n.id)">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg><span class="flex-1" x-text="n.label"></span><span x-show="n.badge" class="rounded-full bg-amber-500 px-2 text-xs font-bold text-navy" x-text="n.badge"></span></button></template>
  </div>

  <!-- ===== Modal: ficha ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modal" x-transition.opacity>
    <form class="card flex max-h-[96vh] w-full max-w-3xl flex-col !rounded-b-none sm:!rounded-b-xl" @submit.prevent="guardarFicha()" @keydown.escape.window="modal=false">
      <div class="card-h"><div><h2 class="text-lg font-bold" x-text="ficha.id ? 'Editar indicador' : 'Nuevo indicador'"></h2><p class="text-xs text-slate-500">Toque <span class="info !h-4 !w-4 !text-[10px]">i</span> junto a cada campo para ver su explicación.</p></div>
        <div class="flex gap-2"><button type="button" class="btn btn-s btn-sm" @click="guia=true">Guía de fórmulas</button><button type="button" class="btn btn-s btn-sm" @click="modal=false" aria-label="Cerrar">✕</button></div></div>
      <div class="card-b space-y-4 overflow-y-auto">
        <p class="rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-900" x-show="fichaBloqueada">Este indicador tiene <b x-text="ficha.n_mediciones"></b> carga(s). Por trazabilidad no se puede cambiar la frecuencia ni las claves de variables y constantes; sí la meta, la fórmula y los textos (quedan en la bitácora y no alteran el histórico).</p>

        <section class="sec"><header class="sec-h"><span class="sec-n">1</span><div><h3 class="font-semibold">Identificación</h3><p class="text-xs text-slate-500">Cómo se llama y quién lo gestiona.</p></div></header>
          <div class="space-y-3 p-4">
            <div class="grid gap-3 sm:grid-cols-3"><div><label class="lbl flex items-center gap-1.5">Código <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('codigo')" :aria-expanded="ay==='codigo'" aria-label="Ayuda: Código">i</button></label><input class="inp" x-model="ficha.codigo" required maxlength="20" placeholder="SIS-01"><div class="ayuda" x-show="ay==='codigo'" x-html="ayudaHtml('codigo')" x-transition></div></div>
              <div class="sm:col-span-2"><label class="lbl flex items-center gap-1.5">Nombre <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('nombre')" :aria-expanded="ay==='nombre'" aria-label="Ayuda: Nombre">i</button></label><input class="inp" x-model="ficha.nombre" required maxlength="150"><div class="ayuda" x-show="ay==='nombre'" x-html="ayudaHtml('nombre')" x-transition></div></div></div>
            <div><label class="lbl flex items-center gap-1.5">Objetivo<button type="button" class="info" @click="toggleAyuda('objetivo')" :aria-expanded="ay==='objetivo'" aria-label="Ayuda: Objetivo">i</button></label><textarea class="inp" rows="2" x-model="ficha.objetivo" maxlength="1000" placeholder="¿Qué se busca lograr con este indicador?"></textarea><div class="ayuda" x-show="ay==='objetivo'" x-html="ayudaHtml('objetivo')" x-transition></div></div>
            <div class="grid gap-3 sm:grid-cols-3"><div><label class="lbl flex items-center gap-1.5">Sigla<button type="button" class="info" @click="toggleAyuda('sigla')" :aria-expanded="ay==='sigla'" aria-label="Ayuda: Sigla">i</button></label><input class="inp" x-model="ficha.sigla" maxlength="20" placeholder="SP"><div class="ayuda" x-show="ay==='sigla'" x-html="ayudaHtml('sigla')" x-transition></div></div>
              <div class="sm:col-span-2"><label class="lbl flex items-center gap-1.5">Área / departamento responsable <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('area')" :aria-expanded="ay==='area'" aria-label="Ayuda: Área / departamento responsable">i</button></label><select class="inp" x-model.number="ficha.area_id" required><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select><div class="ayuda" x-show="ay==='area'" x-html="ayudaHtml('area')" x-transition></div></div></div>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">2</span><div><h3 class="font-semibold">Proceso, objetivo y responsables</h3><p class="text-xs text-slate-500">Datos de la ficha técnica del SGC.</p></div></header>
          <div class="space-y-3 p-4">
            <div><label class="lbl flex items-center gap-1.5">Seguimiento de<button type="button" class="info" @click="toggleAyuda('seguimiento')" :aria-expanded="ay==='seguimiento'" aria-label="Ayuda: Seguimiento de">i</button></label><select class="inp" x-model="ficha.seguimiento"><option value="proceso">Desempeño de proceso</option><option value="objetivo">Objetivo organizacional</option><option value="proveedor">Desempeño de proveedor externo</option></select><div class="ayuda" x-show="ay==='seguimiento'" x-html="ayudaHtml('seguimiento')" x-transition></div></div>
            <div><label class="lbl flex items-center gap-1.5"><span x-text="ficha.seguimiento==='objetivo' ? 'Objetivo organizacional' : 'Proceso'"></span><button type="button" class="info" @click="toggleAyuda('ref_nombre')" aria-label="Ayuda: Proceso">i</button></label><input class="inp" list="dl-ref" x-model="ficha.ref_nombre" @change="elegirRef()" maxlength="200"><datalist id="dl-ref"><template x-for="c in lista(ficha.seguimiento==='objetivo' ? 'objetivo' : 'proceso')" :key="c.id"><option :value="c.valor"></option></template></datalist><div class="ayuda" x-show="ay==='ref_nombre'" x-html="ayudaHtml('ref_nombre')" x-transition></div></div>
            <div><label class="lbl flex items-center gap-1.5"><span x-text="ficha.seguimiento==='objetivo' ? 'Objetivo específico' : ficha.seguimiento==='proveedor' ? 'Bien o servicio' : 'Objetivo del proceso'"></span><button type="button" class="info" @click="toggleAyuda('ref_detalle')" aria-label="Ayuda: Objetivo del proceso">i</button></label><textarea class="inp" rows="2" x-model="ficha.ref_detalle" maxlength="2000"></textarea><div class="ayuda" x-show="ay==='ref_detalle'" x-html="ayudaHtml('ref_detalle')" x-transition></div></div>
            <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl flex items-center gap-1.5">Gerencia<button type="button" class="info" @click="toggleAyuda('gerencia')" :aria-expanded="ay==='gerencia'" aria-label="Ayuda: Gerencia">i</button></label><input class="inp" list="dl-ger" x-model="ficha.gerencia" maxlength="150"><datalist id="dl-ger"><template x-for="c in lista('gerencia')" :key="c.id"><option :value="c.valor"></option></template></datalist></div>
              <div><label class="lbl flex items-center gap-1.5">Líder de proceso<button type="button" class="info" @click="toggleAyuda('lider')" :aria-expanded="ay==='lider'" aria-label="Ayuda: Líder de proceso">i</button></label><input class="inp" list="dl-car" x-model="ficha.lider" maxlength="150"><datalist id="dl-car"><template x-for="c in lista('cargo')" :key="c.id"><option :value="c.valor"></option></template></datalist></div></div>
            <div class="ayuda" x-show="ay==='gerencia'" x-html="ayudaHtml('gerencia')" x-transition></div><div class="ayuda" x-show="ay==='lider'" x-html="ayudaHtml('lider')" x-transition></div>
            <div><label class="lbl flex items-center gap-1.5">Responsables de medición, registro y análisis<button type="button" class="info" @click="toggleAyuda('responsables')" :aria-expanded="ay==='responsables'" aria-label="Ayuda: Responsables de medición, registro y análisis">i</button></label><div class="grid gap-2 sm:grid-cols-3"><input class="inp" list="dl-per" x-model="ficha.resp_medicion" maxlength="150" placeholder="Medición"><input class="inp" list="dl-per" x-model="ficha.resp_registro" maxlength="150" placeholder="Registro"><input class="inp" list="dl-per" x-model="ficha.resp_analisis" maxlength="150" placeholder="Análisis"></div>
              <datalist id="dl-per"><template x-for="n in sugerenciasPersonas" :key="n"><option :value="n"></option></template></datalist><div class="ayuda" x-show="ay==='responsables'" x-html="ayudaHtml('responsables')" x-transition></div></div>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">3</span><div><h3 class="font-semibold">Medición</h3><p class="text-xs text-slate-500">Unidad, frecuencia y sentido de la meta.</p></div></header>
          <div class="space-y-3 p-4">
            <div class="grid gap-3 sm:grid-cols-3">
              <div><label class="lbl flex items-center gap-1.5">Unidad <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('unidad')" :aria-expanded="ay==='unidad'" aria-label="Ayuda: Unidad">i</button></label><input class="inp" list="unidades" x-model="ficha.unidad" required maxlength="12"><datalist id="unidades"><option>%</option><option>días</option><option>horas</option><option>TM</option><option>kg</option><option>USD</option><option>cantidad</option></datalist></div>
              <div><label class="lbl flex items-center gap-1.5">Frecuencia <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('frecuencia')" :aria-expanded="ay==='frecuencia'" aria-label="Ayuda: Frecuencia">i</button></label><select class="inp" x-model="ficha.frecuencia" :disabled="fichaBloqueada"><option value="mensual">Mensual</option><option value="bimestral">Bimestral</option><option value="trimestral">Trimestral</option><option value="cuatrimestral">Cuatrimestral</option><option value="semestral">Semestral</option><option value="anual">Anual</option><option value="eventual">Eventual (cuando ocurra)</option></select></div>
              <div><label class="lbl flex items-center gap-1.5">Decimales<button type="button" class="info" @click="toggleAyuda('decimales')" :aria-expanded="ay==='decimales'" aria-label="Ayuda: Decimales">i</button></label><input class="inp" type="number" min="0" max="6" step="1" x-model.number="ficha.decimales"></div></div>
            <div class="ayuda" x-show="ay==='unidad'" x-html="ayudaHtml('unidad')" x-transition></div><div class="ayuda" x-show="ay==='frecuencia'" x-html="ayudaHtml('frecuencia')" x-transition></div><div class="ayuda" x-show="ay==='decimales'" x-html="ayudaHtml('decimales')" x-transition></div>
            <div><label class="lbl flex items-center gap-1.5">Sentido de la meta <span class="text-red-600">*</span><button type="button" class="info" @click="toggleAyuda('sentido')" :aria-expanded="ay==='sentido'" aria-label="Ayuda: Sentido de la meta">i</button></label><select class="inp" x-model="ficha.sentido"><option value="mayor">Mayor es mejor (ej. cumplimiento)</option><option value="menor">Menor es mejor (ej. obsolescencia, tiempo)</option></select><div class="ayuda" x-show="ay==='sentido'" x-html="ayudaHtml('sentido')" x-transition></div></div>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">4</span><div><h3 class="font-semibold">Metas y semáforo</h3><p class="text-xs text-slate-500">Define cuándo es verde, amarillo o rojo.</p></div></header>
          <div class="space-y-3 p-4"><div class="grid gap-3 sm:grid-cols-2">
            <div><label class="lbl flex items-center gap-1.5"><span x-text="'Meta (verde '+(ficha.sentido==='mayor'?'≥':'≤')+')'"></span><button type="button" class="info" @click="toggleAyuda('meta')" aria-label="Ayuda: Meta">i</button></label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.meta" required></div>
            <div><label class="lbl flex items-center gap-1.5"><span x-text="'Límite crítico (rojo '+(ficha.sentido==='mayor'?'<':'>')+')'"></span><button type="button" class="info" @click="toggleAyuda('limite')" aria-label="Ayuda: Límite">i</button></label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.limite" required></div></div>
            <div class="ayuda" x-show="ay==='meta'" x-html="ayudaHtml('meta')" x-transition></div><div class="ayuda" x-show="ay==='limite'" x-html="ayudaHtml('limite')" x-transition></div>
            <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl flex items-center gap-1.5">Tope de la zona verde (opcional)<button type="button" class="info" @click="toggleAyuda('topes')" :aria-expanded="ay==='topes'" aria-label="Ayuda: Tope de la zona verde (opcional)">i</button></label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.meta_tope" placeholder="sin tope"></div>
              <div><label class="lbl">Tope de la zona amarilla (opcional)</label><input class="inp" type="number" step="any" inputmode="decimal" x-model.number="ficha.limite_tope" placeholder="sin tope"></div></div><div class="ayuda" x-show="ay==='topes'" x-html="ayudaHtml('topes')" x-transition></div>
            <div class="flex flex-wrap gap-2 text-xs font-semibold"><span class="chip border-transparent bg-green-600 text-white" x-text="'Cumple '+(ficha.sentido==='mayor'?'≥ ':'≤ ')+ficha.meta"></span><span class="chip border-transparent bg-amber-500 text-white">Alerta intermedia</span><span class="chip border-transparent bg-red-600 text-white" x-text="'Crítico '+(ficha.sentido==='mayor'?'< ':'> ')+ficha.limite"></span></div>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">5</span><div><h3 class="font-semibold">Variables (datos que digita el jefe)</h3><p class="text-xs text-slate-500">Mantenga pocas: menos campos, menos errores.</p></div><button type="button" class="info ml-auto" @click="toggleAyuda('variables')" aria-label="Ayuda: Variables">i</button></header>
          <div class="space-y-2 p-4"><div class="ayuda" x-show="ay==='variables'" x-html="ayudaHtml('variables')" x-transition></div>
            <template x-for="(v,idx) in ficha.variables" :key="idx"><div class="rounded-lg border border-slate-200 p-2">
              <div class="grid grid-cols-[1fr_auto] gap-2">
                <input class="inp" x-model="v.etiqueta" @input="autoClave(v)" placeholder="Etiqueta visible (ej. Solicitudes gestionadas)" aria-label="Etiqueta" required>
                <div class="flex gap-1"><button type="button" class="btn btn-s !px-2" @click="mover(idx,-1)" :disabled="idx===0" aria-label="Subir">↑</button><button type="button" class="btn btn-s !px-2" @click="mover(idx,1)" :disabled="idx===ficha.variables.length-1" aria-label="Bajar">↓</button>
                  <button type="button" class="btn btn-s !px-2" @click="ficha.variables.splice(idx,1); validarFormula()" :disabled="fichaBloqueada || ficha.variables.length<2" aria-label="Quitar">✕</button></div></div>
              <div class="mt-2 flex items-center gap-2"><span class="text-xs text-slate-500">clave</span><input class="inp !min-h-[36px] font-mono !text-sm" x-model="v.clave" @input="v._manual=true; validarFormula()" :disabled="fichaBloqueada" pattern="[a-z][a-z0-9_]*" aria-label="Clave" required>
                <button type="button" class="btn btn-s btn-sm whitespace-nowrap" @click="v._op=!v._op" x-text="v._op ? 'Ocultar' : 'Opciones'"></button></div>
              <div class="mt-2 space-y-2 rounded-lg bg-slate-50 p-2" x-show="v._op" x-transition>
                <input class="inp" x-model="v.ayuda" maxlength="300" placeholder="Texto de ayuda para quien carga (ej. «Sin incluir devoluciones»)">
                <input class="inp" x-model="v.unidad" maxlength="12" placeholder="Unidad que se muestra junto al campo (ej. TM, h, USD)">
                <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="h-5 w-5" x-model="v.opcional"> Opcional (si queda vacío se usa un valor por defecto)</label>
                <input class="inp" type="number" step="any" x-model.number="v.defecto" x-show="v.opcional" placeholder="Valor por defecto">
                <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="h-5 w-5" x-model="v.negativo"> Permite valores negativos</label></div>
            </div></template>
            <button type="button" class="btn btn-s btn-sm" @click="ficha.variables.push({clave:'',etiqueta:''})" :disabled="fichaBloqueada || ficha.variables.length>=12">+ Variable</button>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">6</span><div><h3 class="font-semibold">Constantes <span class="text-xs font-normal text-slate-500">(opcional)</span></h3><p class="text-xs text-slate-500">Valores fijos usados en la fórmula; el jefe no los ve.</p></div><button type="button" class="info ml-auto" @click="toggleAyuda('constantes')" aria-label="Ayuda: Constantes">i</button></header>
          <div class="space-y-2 p-4"><div class="ayuda" x-show="ay==='constantes'" x-html="ayudaHtml('constantes')" x-transition></div>
            <template x-for="(c,idx) in ficha.constantes" :key="'c'+idx"><div class="grid grid-cols-2 gap-2 sm:grid-cols-[1fr_9rem_7rem_auto]">
              <input class="inp col-span-2 sm:col-span-1" x-model="c.etiqueta" @input="autoClave(c)" placeholder="Nombre (ej. Horas por turno)" required>
              <input class="inp font-mono !text-sm" x-model="c.clave" @input="c._manual=true; validarFormula()" :disabled="fichaBloqueada" placeholder="clave" pattern="[a-z][a-z0-9_]*" required>
              <input class="inp" type="number" step="any" x-model.number="c.valor" @input="probar()" placeholder="Valor" required>
              <button type="button" class="btn btn-s !px-2" @click="ficha.constantes.splice(idx,1); validarFormula()" :disabled="fichaBloqueada" aria-label="Quitar">✕</button></div></template>
            <button type="button" class="btn btn-s btn-sm" @click="ficha.constantes.push({clave:'',etiqueta:'',valor:0})" :disabled="fichaBloqueada || ficha.constantes.length>=12">+ Constante</button>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">7</span><div><h3 class="font-semibold">Fórmula</h3><p class="text-xs text-slate-500">Cómo se calcula el resultado. Se valida y se prueba en vivo.</p></div><button type="button" class="info ml-auto" @click="toggleAyuda('formula')" aria-label="Ayuda: Fórmula">i</button></header>
          <div class="space-y-3 p-4"><div class="ayuda" x-show="ay==='formula'" x-html="ayudaHtml('formula')" x-transition></div>
            <textarea class="inp font-mono" rows="3" x-ref="formula" x-model="ficha.formula" @input.debounce.300ms="validarFormula()" required spellcheck="false" placeholder="si(recibidas > 0, gestionadas / recibidas * 100, 100)"></textarea>
            <div class="space-y-1.5">
              <div class="flex flex-wrap gap-1"><span class="self-center pr-1 text-xs text-slate-500">Variables</span><template x-for="v in ficha.variables.filter(v=>v.clave)"><button type="button" class="rounded border border-slate-300 px-2 py-1 font-mono text-xs hover:bg-slate-100" @click="insertar(v.clave)" x-text="v.clave"></button></template>
                <template x-for="c in (ficha.constantes||[]).filter(c=>c.clave)"><button type="button" class="rounded border border-violet-300 bg-violet-50 px-2 py-1 font-mono text-xs hover:bg-violet-100" @click="insertar(c.clave)" x-text="c.clave"></button></template></div>
              <div class="flex flex-wrap gap-1"><span class="self-center pr-1 text-xs text-slate-500">Operadores</span><template x-for="o in ['+','−','×','÷','^','(',')','>','<','>=','<=','==','!=','and','or']"><button type="button" class="min-w-[2rem] rounded border border-slate-300 px-2 py-1 font-mono text-xs hover:bg-slate-100" @click="insertar(o==='−'?'-':o==='×'?'*':o==='÷'?'/':o)" x-text="o"></button></template></div>
              <div class="flex flex-wrap gap-1"><span class="self-center pr-1 text-xs text-slate-500">Funciones</span><template x-for="f in ['si','div','pct','min','max','sum','avg','abs','round','sqrt','clamp']"><button type="button" class="rounded border border-sky-300 bg-sky-50 px-2 py-1 font-mono text-xs hover:bg-sky-100" @click="insertar(f+'()',1)" x-text="f+'( )'"></button></template></div>
            </div>
            <p class="text-xs" :class="!formulaMsg.ok ? 'text-red-600' : formulaMsg.aviso ? 'text-amber-700' : 'text-green-700'" x-text="formulaMsg.txt"></p>
            <p class="rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-600" x-show="ficha.formula && formulaMsg.ok"><b>Se lee:</b> <span x-text="formulaLegible({formula: ficha.formula, variables: ficha.variables.filter(v=>v.clave), constantes: (ficha.constantes||[]).filter(c=>c.clave)})"></span></p>
            <div class="rounded-lg border border-dashed border-slate-300 p-3" x-show="ficha.formula && formulaMsg.ok">
              <div class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-600">Probar con valores de ejemplo</div>
              <div class="grid gap-2 sm:grid-cols-2"><template x-for="v in ficha.variables.filter(v=>v.clave)" :key="v.clave"><div><label class="text-xs text-slate-600" x-text="(v.etiqueta || v.clave) + (v.opcional ? ' (opcional)' : '')"></label><input class="inp" type="number" step="any" inputmode="decimal" x-model="prueba.valores[v.clave]" @input.debounce.250ms="probar()"></div></template></div>
              <div class="mt-3" x-show="prueba.res">
                <template x-if="prueba.res && prueba.res.ok"><div class="flex items-center gap-3"><span class="text-2xl font-bold" x-text="fmt(prueba.res.resultado, ficha.unidad, ficha.decimales)"></span><span class="chip border-transparent text-white" :class="semBg(prueba.res.semaforo)" x-text="semTxt(prueba.res.semaforo)"></span></div></template>
                <p class="text-sm text-red-600" x-show="prueba.res && !prueba.res.ok" x-text="prueba.res && prueba.res.error"></p></div>
            </div>
          </div></section>

        <section class="sec"><header class="sec-h"><span class="sec-n">8</span><div><h3 class="font-semibold">Documentación</h3><p class="text-xs text-slate-500">Respaldo para auditorías.</p></div></header>
          <div class="space-y-3 p-4">
            <div><label class="lbl flex items-center gap-1.5">Fuente de los datos<button type="button" class="info" @click="toggleAyuda('fuente')" :aria-expanded="ay==='fuente'" aria-label="Ayuda: Fuente de los datos">i</button></label><input class="inp" x-model="ficha.fuente" maxlength="500" placeholder="ERP, informe de producción, laboratorio…"><div class="ayuda" x-show="ay==='fuente'" x-html="ayudaHtml('fuente')" x-transition></div></div>
            <div><label class="lbl flex items-center gap-1.5">Método y observaciones<button type="button" class="info" @click="toggleAyuda('notas')" :aria-expanded="ay==='notas'" aria-label="Ayuda: Método y observaciones">i</button></label><textarea class="inp" rows="2" x-model="ficha.notas" maxlength="2000"></textarea><div class="ayuda" x-show="ay==='notas'" x-html="ayudaHtml('notas')" x-transition></div></div>
            <div><label class="flex items-center gap-2 text-sm"><input type="checkbox" class="h-5 w-5" x-model="ficha.activo"> Indicador activo <button type="button" class="info" @click="toggleAyuda('activo')" aria-label="Ayuda: Activo">i</button></label><div class="ayuda" x-show="ay==='activo'" x-html="ayudaHtml('activo')" x-transition></div></div>
          </div></section>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modal=false">Cancelar</button><button class="btn btn-p" :disabled="busy || !formulaMsg.ok">Guardar indicador</button></div>
    </form>
  </div>

  <!-- ===== Guía de fórmulas ===== -->
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-navy/70 sm:items-center sm:p-4" x-show="guia" x-transition.opacity @keydown.escape.window="guia=false">
    <div class="card flex max-h-[92vh] w-full max-w-3xl flex-col !rounded-b-none sm:!rounded-b-xl">
      <div class="card-h"><h2 class="text-lg font-bold">Guía de fórmulas</h2><button type="button" class="btn btn-s btn-sm" @click="guia=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-5 overflow-y-auto text-sm">
        <div><h3 class="mb-1 font-semibold">Reglas básicas</h3><ul class="list-disc space-y-1 pl-5 text-slate-700"><li>Use las <b>claves</b> de las variables y constantes tal como aparecen en los botones.</li><li>Operadores: <code>+ − × ÷</code>, <code>^</code> potencia, <code>%</code> resto, <code>//</code> división entera, paréntesis.</li><li>Comparaciones: <code>&gt; &lt; &gt;= &lt;= == !=</code>; lógica: <code>and or not</code>.</li><li>Para evitar «división entre cero» use <code>si(b &gt; 0, a / b, 0)</code> o <code>div(a, b, 0)</code>.</li><li>Decimales con punto: <code>0.5</code>. Máximo 1000 caracteres.</li></ul></div>
        <div><h3 class="mb-2 font-semibold">Funciones</h3><div class="divide-y divide-slate-100 rounded-lg border border-slate-200"><template x-for="f in funcDoc" :key="f[0]"><div class="p-3"><code class="font-semibold text-brand" x-text="f[0]"></code><p class="text-slate-600" x-text="f[1]"></p><code class="text-xs text-slate-500" x-text="'Ej.: ' + f[2]"></code></div></template></div></div>
        <div><h3 class="mb-2 font-semibold">Ejemplos listos para usar</h3><div class="space-y-2"><template x-for="e in ejemplos" :key="e.t"><div class="rounded-lg border border-slate-200 p-3"><div class="font-semibold" x-text="e.t"></div><p class="text-slate-600" x-text="e.d"></p><code class="mt-1 block break-words rounded bg-slate-50 px-2 py-1 text-xs" x-text="e.f"></code><button type="button" class="btn btn-s btn-sm mt-2" @click="usarEjemplo(e)">Usar este ejemplo</button></div></template></div></div>
      </div>
    </div>
  </div>

  <!-- ===== Modal: usuario ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modalUsuario" x-transition.opacity>
    <form class="card flex max-h-[92vh] w-full max-w-lg flex-col !rounded-b-none sm:!rounded-b-xl" @submit.prevent="guardarUsuario()" @keydown.escape.window="modalUsuario=false">
      <div class="card-h"><h2 class="text-lg font-bold" x-text="usuario.id ? 'Editar usuario' : 'Nuevo usuario'"></h2><button type="button" class="btn btn-s btn-sm" @click="modalUsuario=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-4 overflow-y-auto">
        <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl">Usuario</label><input class="inp" x-model="usuario.username" :disabled="!!usuario.id" pattern="[a-z0-9._-]{3,40}" autocapitalize="none" required><p class="mt-1 text-xs text-slate-500">Minúsculas, números, punto, guion.</p></div>
          <div><label class="lbl">Nombre completo</label><input class="inp" x-model="usuario.nombre" required minlength="3"></div></div>
        <div class="grid gap-3 sm:grid-cols-2">
          <div><label class="lbl">Rol</label><select class="inp" x-model="usuario.rol"><option value="jefe">Jefe de Área</option><option value="gerente">Gerente / Auditor SGC</option><option value="admin">Administrador SGC</option></select></div>
          <div x-show="usuario.rol==='jefe'"><label class="lbl">Área</label><select class="inp" x-model.number="usuario.area_id" :required="usuario.rol==='jefe'"><option value="">Seleccione…</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select></div>
        </div>
        <div><label class="lbl" x-text="usuario.id ? 'Nueva contraseña (opcional)' : 'Contraseña inicial'"></label><input class="inp" type="password" x-model="usuario.password" minlength="10" autocomplete="new-password" :required="!usuario.id"><p class="mt-1 text-xs text-slate-500">Mínimo 10 caracteres. Al restablecerla se cierran sus sesiones activas.</p></div>
        <label class="flex items-center gap-2 text-sm" x-show="usuario.id"><input type="checkbox" class="h-5 w-5" x-model="usuario.activo"> Usuario activo</label>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modalUsuario=false">Cancelar</button><button class="btn btn-p" :disabled="busy">Guardar</button></div>
    </form>
  </div>

  <!-- ===== Modal: contraseña ===== -->
  <div class="fixed inset-0 z-40 flex items-end justify-center bg-navy/60 sm:items-center sm:p-4" x-show="modalClave" x-transition.opacity>
    <form class="card w-full max-w-sm !rounded-b-none sm:!rounded-b-xl" @submit.prevent="cambiarClave()" @keydown.escape.window="modalClave=false">
      <div class="card-h"><h2 class="text-lg font-bold">Cambiar contraseña</h2><button type="button" class="btn btn-s btn-sm" @click="modalClave=false" aria-label="Cerrar">✕</button></div>
      <div class="card-b space-y-4">
        <div><label class="lbl">Contraseña actual</label><input class="inp" type="password" x-model="clave.actual" autocomplete="current-password" required></div>
        <div><label class="lbl">Nueva contraseña</label><input class="inp" type="password" x-model="clave.nueva" minlength="10" autocomplete="new-password" required></div>
        <div><label class="lbl">Repita la nueva contraseña</label><input class="inp" type="password" x-model="clave.repetir" minlength="10" autocomplete="new-password" required></div>
        <p class="text-sm text-red-600" x-show="clave.repetir && clave.nueva!==clave.repetir">Las contraseñas no coinciden.</p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 p-4 safe-b"><button type="button" class="btn btn-s" @click="modalClave=false">Cancelar</button><button class="btn btn-p" :disabled="busy || clave.nueva!==clave.repetir">Guardar</button></div>
    </form>
  </div>
</div>
</template>
</body>
</html>
