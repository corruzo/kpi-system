<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>SIGT · Tripoliven</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f172a'/><path d='M7 22V10m6 12V14m6 8V8m6 14V12' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script defer src="/static/vendor/chart.umd.js"></script>
  <script defer src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <style>[x-cloak]{display:none!important}.safe-b{padding-bottom:env(safe-area-inset-bottom)}
  .fade-in{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}</style>
</head>
<body x-data="sigt()" x-init="init()" x-cloak>

<div class="fixed inset-x-4 top-4 z-[60] mx-auto max-w-sm" x-show="toast.msg" x-transition role="status">
  <div class="rounded-lg px-4 py-3 text-sm font-medium text-white" :class="toast.error ? 'bg-red-600' : 'bg-navy'" x-text="toast.msg"></div>
</div>

<!-- ===================== LOGIN ===================== -->
<template x-if="!user && ready">
  <main class="min-h-screen md:grid md:grid-cols-2">
    <section class="bg-navy px-6 py-10 text-white md:flex md:flex-col md:justify-between md:p-14">
      <div class="flex items-center gap-3">
        <svg class="h-10 w-10" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0284c7"/><path d="M7 22V10m6 12V14m6 8V8m6 14V12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        <div><div class="text-xl font-bold leading-none">SIGT</div><div class="text-xs text-slate-300">Tripoliven, C.A.</div></div>
      </div>
      <div class="mt-8 md:mt-0">
        <h1 class="text-2xl font-bold leading-tight md:text-4xl">Sistema de Indicadores de Gestión</h1>
        <p class="mt-3 max-w-md text-slate-300">Carga, aprobación y análisis de indicadores del Sistema de Gestión de la Calidad bajo ISO 9001:2015.</p>
      </div>
      <p class="mt-8 hidden text-xs text-slate-400 md:block">Acceso exclusivo para personal autorizado. Toda acción queda registrada en la bitácora de trazabilidad.</p>
    </section>
    <section class="flex items-start justify-center px-4 py-8 md:items-center md:p-14">
      <form class="card w-full max-w-sm space-y-4 p-6" @submit.prevent="login()">
        <div><h2 class="text-xl font-bold">Iniciar sesión</h2><p class="text-sm text-slate-600">Ingrese con su usuario institucional.</p></div>
        <div><label class="lbl" for="u">Usuario</label><input id="u" class="inp" x-model="loginForm.username" autocomplete="username" autocapitalize="none" autofocus required></div>
        <div><label class="lbl" for="p">Contraseña</label><input id="p" class="inp" type="password" x-model="loginForm.password" autocomplete="current-password" required></div>
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" x-show="loginError" x-text="loginError" role="alert"></p>
        <button class="btn btn-p w-full" :disabled="busy" x-text="busy ? 'Ingresando…' : 'Ingresar'"></button>
      </form>
    </section>
  </main>
</template>

<!-- ===================== APP ===================== -->
<template x-if="user">
<div class="min-h-screen">
  <header class="sticky top-0 z-30 bg-navy text-white">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4">
      <div class="flex items-center gap-2.5">
        <svg class="h-8 w-8" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0284c7"/><path d="M7 22V10m6 12V14m6 8V8m6 14V12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        <div class="leading-tight"><div class="font-bold">SIGT</div><div class="hidden text-[11px] text-slate-300 sm:block">Tripoliven, C.A. · ISO 9001:2015</div></div>
      </div>
      <div class="relative">
        <button class="flex min-h-[44px] items-center gap-2 rounded-lg px-2 hover:bg-slate-800" @click="menu=!menu" :aria-expanded="menu" aria-label="Menú de usuario">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand text-sm font-bold" x-text="iniciales()"></span>
          <span class="hidden text-left leading-tight sm:block"><span class="block text-sm font-semibold" x-text="user.nombre"></span><span class="block text-[11px] text-slate-300" x-text="rolNombre(user) + (user.area ? ' · ' + user.area : '')"></span></span>
        </button>
        <div class="absolute right-0 mt-1 w-64 rounded-xl border border-slate-200 bg-white p-2 text-slate-900" x-show="menu" @click.outside="menu=false" x-transition>
          <div class="border-b border-slate-100 px-3 py-2 sm:hidden"><div class="text-sm font-semibold" x-text="user.nombre"></div><div class="text-xs text-slate-500" x-text="rolNombre(user) + (user.area ? ' · ' + user.area : '')"></div></div>
          <button class="w-full rounded-lg px-3 py-2.5 text-left text-sm hover:bg-slate-50" @click="abrirClave()">Cambiar contraseña</button>
          <button class="w-full rounded-lg px-3 py-2.5 text-left text-sm text-red-700 hover:bg-red-50" @click="logout()">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <!-- navegación escritorio -->
  <nav class="hidden border-b border-slate-200 bg-white md:block" aria-label="Principal">
    <div class="mx-auto flex max-w-6xl gap-1 overflow-x-auto px-4">
      <template x-for="n in nav()" :key="n.id">
        <button class="relative flex shrink-0 items-center gap-2 whitespace-nowrap border-b-[3px] px-3 py-3.5 text-sm font-semibold" :class="view===n.id ? 'border-brand text-brand' : 'border-transparent text-slate-600 hover:text-slate-900'" @click="go(n.id)">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path :d="icono(n.id)"/></svg>
          <span x-text="n.label"></span>
          <span x-show="n.badge" class="rounded-full bg-amber-500 px-2 text-xs font-bold text-navy" x-text="n.badge"></span>
        </button>
      </template>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 pb-28 pt-5 md:pb-10">

    <!-- ============ CARGA RÁPIDA ============ -->
    <section x-show="view==='carga'" class="mx-auto max-w-3xl space-y-4">
      <div><div class="flex items-center gap-2"><h1 class="text-2xl font-bold">Carga rápida</h1><button type="button" class="info" @click="toggleAyuda('carga')" aria-label="¿Cómo cargar?">i</button></div><p class="text-sm text-slate-600">Ingrese solo los datos base. El sistema calcula el resultado y el semáforo.</p>
        <div class="ayuda" x-show="ay==='carga'" x-html="ayudaHtml('carga')" x-transition></div></div>

      <div class="card p-8 text-center" x-show="!indicadoresCarga.length">
        <p class="font-semibold" x-text="user.rol==='admin' ? 'No hay indicadores activos.' : 'Su área aún no tiene indicadores asignados.'"></p>
        <p class="mt-1 text-sm text-slate-600" x-text="user.rol==='admin' ? 'Cree fichas en la sección Indicadores.' : 'Solicite al Administrador SGC que cree las fichas técnicas de su área.'"></p>
      </div>

      <template x-if="indicadoresCarga.length">
      <div class="space-y-4">
        <div class="card border-amber-300 bg-amber-50" x-show="pendientesTotal()" x-transition>
          <div class="card-b">
            <div class="mb-2 text-xs font-semibold uppercase tracking-wide text-amber-900">Pendientes de carga</div>
            <div class="flex flex-wrap gap-2">
              <template x-for="p in listaPendientes()" :key="p.ind.id + p.periodo">
                <button class="min-h-[40px] rounded-full border border-amber-400 bg-white px-3 text-sm text-amber-900 hover:bg-amber-100" @click="elegirPendiente(p)"><b x-text="p.ind.codigo"></b> · <span x-text="p.etiqueta"></span></button>
              </template>
            </div>
          </div>
        </div>
        <div class="card border-green-200 bg-green-50 px-4 py-3 text-sm font-medium text-green-800" x-show="!pendientesTotal()">✔ Está al día con todas sus cargas.</div>

        <div class="card">
          <div class="card-b grid gap-4 sm:grid-cols-2">
            <div>
              <label class="lbl" for="sel-ind">Indicador</label>
              <select id="sel-ind" class="inp" x-model.number="f.indicador_id" @change="cambiarIndicador()">
                <option value="">Seleccione…</option>
                <template x-for="i in indicadoresCarga" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre + (user.rol==='admin' ? ' (' + i.area + ')' : '')"></option></template>
              </select>
            </div>
            <div>
              <label class="lbl" for="sel-per">Período</label>
              <select id="sel-per" class="inp" x-model="f.periodo" @change="cambiarPeriodo()" :disabled="!periodosInd.length">
                <template x-for="p in periodosInd" :key="p.periodo"><option :value="p.periodo" x-text="p.etiqueta + (p.actual ? ' (en curso)' : '') + estadoSufijo(p)"></option></template>
              </select>
            </div>
          </div>
        </div>

        <template x-if="ind">
          <div class="space-y-4 fade-in">
            <div class="card">
              <div class="card-b space-y-1 text-sm">
                <div class="flex items-start justify-between gap-2"><div class="font-semibold" x-text="ind.nombre"></div><button type="button" class="info" @click="fichaAbierta=!fichaAbierta" aria-label="Ver ficha técnica del indicador">i</button></div>
                <div class="text-slate-600" x-text="ind.objetivo"></div>
                <div class="ayuda !mt-2 space-y-1" x-show="fichaAbierta" x-transition>
                  <button type="button" class="btn btn-s btn-sm" @click="verFicha(ind.id)">Abrir ficha técnica completa</button>
                  <div><b>Área:</b> <span x-text="ind.area"></span> · <b>Frecuencia:</b> <span x-text="cap(ind.frecuencia)"></span> · <b>Unidad:</b> <span x-text="ind.unidad"></span></div>
                  <div x-show="ind.fuente"><b>Fuente de datos:</b> <span x-text="ind.fuente"></span></div>
                  <div x-show="ind.notas"><b>Método:</b> <span x-text="ind.notas"></span></div>
                  <div x-show="ind.constantes && ind.constantes.length"><b>Constantes:</b> <span x-text="(ind.constantes||[]).map(c => c.etiqueta + ' = ' + c.valor).join(' · ')"></span></div>
                  <div><b>Semáforo:</b> verde = cumple la meta, amarillo = alerta, rojo = crítico (requiere análisis y plan de mejora).</div></div>
                <div class="text-xs text-slate-500 pt-1">Meta <b class="text-slate-800" x-text="umbralTxt(ind)"></b></div>
                <div class="text-xs text-slate-500">Fórmula <span class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-slate-700" x-text="formulaLegible(ind)"></span></div>
              </div>
            </div>

            <div x-show="medActual && medActual.estado!=='observado'" class="card px-4 py-3 text-sm" :class="medActual && medActual.estado==='aprobado' ? 'border-green-300 bg-green-50 text-green-900' : 'border-sky-300 bg-sky-50 text-sky-900'">
              <b x-text="medActual && medActual.estado==='aprobado' ? 'Carga aprobada.' : 'Carga enviada, en revisión.'"></b>
              <span x-text="medActual ? ' Cargada por ' + medActual.cargado_por + ' el ' + fecha(medActual.cargado_en) + '.' : ''"></span>
              <span x-show="medActual && medActual.nota_revision" x-text="' Nota: ' + (medActual && medActual.nota_revision)"></span>
            </div>
            <div x-show="medActual && medActual.estado==='observado'" class="card border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
              <b>Carga devuelta por el Gerente / Auditor.</b> Corrija y reenvíe.<br><span x-text="'Observación: ' + (medActual ? medActual.nota_revision : '')"></span>
            </div>

            <div class="card">
              <div class="card-h"><h2 class="font-semibold">Datos del período</h2></div>
              <div class="card-b grid gap-4 sm:grid-cols-2">
                <template x-for="v in ind.variables" :key="v.clave">
                  <div>
                    <label class="lbl"><span x-text="v.etiqueta"></span><span class="normal-case text-slate-400" x-show="v.opcional"> (opcional)</span></label>
                    <div class="relative"><input class="inp !text-xl !font-semibold" :class="v.unidad && '!pr-14'" type="number" inputmode="decimal" step="any" :min="v.negativo ? null : 0" :disabled="bloqueado" x-model="f.valores[v.clave]" @input.debounce.200ms="calcular()" :placeholder="v.opcional ? String(v.defecto ?? 0) : '0'">
                      <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400" x-show="v.unidad" x-text="v.unidad"></span></div>
                    <p class="mt-1 text-xs text-slate-500" x-show="v.ayuda" x-text="v.ayuda"></p>
                  </div>
                </template>
              </div>
            </div>

            <div class="card border-2 transition-colors" :class="calc && calc.ok ? semBorde(calc.semaforo) : ''" aria-live="polite">
              <div class="card-b flex items-center justify-between gap-4">
                <div>
                  <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500">Resultado <button type="button" class="info" @click="toggleAyuda('semaforo')" aria-label="¿Qué significa el semáforo?">i</button></div>
                  <div class="text-4xl font-bold" x-text="calc && calc.ok ? fmt(calc.resultado, ind.unidad, ind.decimales) : '—'"></div>
                  <div class="text-sm text-red-600" x-show="calc && !calc.ok && f.tocado" x-text="calc && calc.error"></div>
                  <div class="ayuda max-w-md" x-show="ay==='semaforo'" x-html="ayudaHtml('semaforo')" x-transition></div>
                </div>
                <div x-show="calc && calc.ok" class="text-right">
                  <span class="chip !px-4 !py-2 !text-sm !text-white !border-transparent" :class="semBg(calc && calc.semaforo)" x-text="semTxt(calc && calc.semaforo)"></span>
                  <div class="mt-1 text-xs text-slate-500" x-text="'Meta ' + umbralTxt(ind)"></div>
                </div>
              </div>
            </div>

            <div x-show="calc && calc.ok && calc.requiere_analisis" x-transition class="card border-amber-300 bg-amber-50">
              <div class="card-b space-y-4">
                <div class="text-sm font-semibold text-amber-900">Indicador fuera de meta: el análisis y el plan de mejora son obligatorios (ISO 9001:2015).</div>
                <div><label class="lbl">Resultados del análisis <span class="text-red-600">*</span></label><textarea class="inp" rows="3" :disabled="bloqueado" x-model="f.analisis" placeholder="¿Qué causó la desviación?"></textarea></div>
                <div><label class="lbl">Correcciones / plan de mejora <span class="text-red-600">*</span></label><textarea class="inp" rows="3" :disabled="bloqueado" x-model="f.plan_mejora" placeholder="Acciones, responsable y fecha compromiso"></textarea></div>
                <div class="text-xs text-amber-800" x-show="!bloqueado && !analisisOk()">Mínimo 10 caracteres en cada campo.</div>
              </div>
            </div>

            <button class="btn btn-p w-full sm:w-auto sm:float-right" x-show="!bloqueado" :disabled="!puedeEnviar() || busy" @click="enviar()" x-text="medActual && medActual.estado==='observado' ? 'Reenviar para revisión' : 'Enviar carga'"></button>
          </div>
        </template>
      </div>
      </template>
    </section>

    <!-- ============ HISTORIAL ============ -->
    <section x-show="view==='historial'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h1 class="text-2xl font-bold" x-text="user.rol==='jefe' ? 'Mis cargas' : 'Todas las cargas'"></h1><p class="text-sm text-slate-600">Historial con valores, análisis y revisiones.</p></div>
        <button class="btn btn-s" x-show="user.rol!=='jefe'" :disabled="busy" @click="descargarReporte()">Descargar Excel</button>
      </div>
      <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        <select class="inp" x-model="filtro.indicador_id" @change="cargarHistorial()" aria-label="Filtrar por indicador"><option value="">Todos los indicadores</option><template x-for="i in indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select>
        <select class="inp" x-model="filtro.estado" @change="cargarHistorial()" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="enviado">En revisión</option><option value="aprobado">Aprobado</option><option value="observado">Devuelto</option></select>
        <select class="inp" x-model="filtro2.semaforo" @change="cargarHistorial()" aria-label="Filtrar por semáforo"><option value="">Todos los semáforos</option><option value="verde">Cumple</option><option value="amarillo">Alerta</option><option value="rojo">Crítico</option></select>
        <input class="inp" x-model="filtro2.periodo" @input.debounce.400ms="cargarHistorial()" placeholder="Período exacto (ej. 2026-09, 2026-Q3)" aria-label="Período">
        <select class="inp" x-show="user.rol!=='jefe'" x-model="filtro2.area_id" @change="cargarHistorial()" aria-label="Filtrar por área"><option value="">Todas las áreas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select>
      </div>
      <div class="space-y-3">
        <template x-for="m in historial" :key="m.id">
          <div class="card" x-data="{open:false}">
            <button class="flex w-full items-center gap-3 p-4 text-left" @click="open=!open" :aria-expanded="open">
              <span class="h-10 w-1.5 shrink-0 rounded-full" :class="semBg(m.semaforo)"></span>
              <span class="min-w-0 flex-1">
                <span class="block text-xs text-slate-500" x-text="m.codigo + ' · ' + m.periodo_etiqueta + ' · ' + m.area"></span>
                <span class="block truncate font-semibold" x-text="m.indicador"></span>
              </span>
              <span class="text-right"><span class="block text-lg font-bold" x-text="fmt(m.resultado, m.unidad, m.decimales)"></span><span class="chip" :class="estadoClase(m.estado)" x-text="estadoTxt(m.estado)"></span></span>
            </button>
            <div x-show="open" class="space-y-3 border-t border-slate-100 p-4" x-transition>
              <div x-html="detalleHtml(m)"></div>
              <div class="space-y-2 rounded-lg bg-amber-50 p-3" x-show="['gerente','admin'].includes(user.rol) && m.estado==='aprobado'">
                <p class="text-xs text-amber-900">¿Se detectó un error en una carga aprobada? Devuélvala al jefe de área para corregirla (queda registrado).</p>
                <div class="flex flex-col gap-2 sm:flex-row"><input class="inp" x-model="reabrirNota[m.id]" placeholder="Motivo de la reapertura"><button class="btn btn-d whitespace-nowrap" :disabled="busy" @click="reabrir(m)">Reabrir carga</button></div></div>
              <button class="btn btn-s btn-sm" @click="verFicha(m.indicador_id)">Ver ficha del indicador</button>
              <div class="flex flex-col gap-2 sm:flex-row" x-show="['gerente','admin'].includes(user.rol)">
                <input class="inp" x-model="notasHist[m.id]" placeholder="Agregar nota de auditoría" @keydown.enter.prevent="agregarNota(m)">
                <button class="btn btn-s whitespace-nowrap" :disabled="busy" @click="agregarNota(m)">Agregar nota</button>
              </div>
            </div>
          </div>
        </template>
        <div class="card p-8 text-center text-sm text-slate-500" x-show="!historial.length">No hay cargas que coincidan.</div>
        <button class="btn btn-s w-full" x-show="histMas" @click="cargarHistorial(false)">Cargar más</button>
      </div>
    </section>

    <!-- ============ BANDEJA ============ -->
    <section x-show="view==='bandeja'" class="mx-auto max-w-4xl space-y-4">
      <div><h1 class="text-2xl font-bold">Bandeja de aprobación</h1><p class="text-sm text-slate-600">Cargas enviadas por los jefes de área, pendientes de revisión.</p></div>
      <template x-for="m in bandeja" :key="m.id">
        <div class="card fade-in">
          <div class="card-h">
            <div class="min-w-0"><div class="text-xs text-slate-500" x-text="m.area + ' · ' + m.periodo_etiqueta + (m.version>1 ? ' · reenvío v'+m.version : '')"></div><div class="truncate font-semibold" x-text="m.codigo + ' · ' + m.indicador"></div></div>
            <div class="flex shrink-0 items-center gap-2"><span class="text-xl font-bold" x-text="fmt(m.resultado, m.unidad, m.decimales)"></span><span class="chip !border-transparent !text-white" :class="semBg(m.semaforo)" x-text="semTxt(m.semaforo)"></span></div>
          </div>
          <div class="card-b space-y-4">
            <div x-html="detalleHtml(m)"></div>
            <div><label class="lbl">Nota de auditoría / motivo de devolución</label><textarea class="inp" rows="2" x-model="notas[m.id]" placeholder="Opcional al aprobar; obligatoria al devolver"></textarea></div>
            <p class="rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-900" x-show="m.cargado_por_id===user.id">Carga realizada por usted: por segregación de funciones debe revisarla otra persona.</p>
            <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
              <button class="btn btn-d" :disabled="busy || m.cargado_por_id===user.id" @click="revisar(m,'observar')">Devolver con observación</button>
              <button class="btn btn-p" :disabled="busy || m.cargado_por_id===user.id" @click="revisar(m,'aprobar')">Aprobar formalmente</button>
            </div>
          </div>
        </div>
      </template>
      <div class="card p-10 text-center text-slate-500" x-show="!bandeja.length">✔ No hay cargas pendientes de revisión.</div>
    </section>

    <!-- ============ PANEL ============ -->
    <section x-show="view==='panel'" class="space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">

          </template>
        </div>
        <div class="grid gap-4 lg:grid-cols-3">
          <div class="card lg:col-span-2">
            <div class="card-h flex-wrap"><h2 class="font-semibold">Tendencia vs. meta</h2>
              <select class="inp !min-h-[36px] !w-full !py-1 text-sm sm:!w-auto sm:max-w-xs" x-model.number="tendInd" @change="dibujar()" aria-label="Indicador"><template x-for="i in dash.indicadores" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select></div>

          </div>

        </div>
        <div class="card">
          <div class="card-h"><div><h2 class="font-semibold">Cumplimiento por departamento</h2><p class="text-xs text-slate-500">% de indicadores por semáforo; la parte verde es el cumplimiento.</p></div></div>

            <table class="w-full"><thead><tr><th class="th">Código</th><th class="th">Indicador</th><th class="th">Área</th><th class="th">Último período</th><th class="th">Resultado</th><th class="th">Meta</th><th class="th">Semáforo</th></tr></thead>
              <tbody><template x-for="i in dash.indicadores" :key="i.id">
                <tr class="cursor-pointer hover:bg-slate-50" @click="verTendencia(i)">
                  <td class="td font-semibold" x-text="i.codigo"></td><td class="td" x-text="i.nombre"></td><td class="td" x-text="i.area"></td>
                  <td class="td"><span x-text="i.ultimo ? i.ultimo.etiqueta : '—'"></span><span x-show="i.pendiente" class="ml-1 text-xs text-amber-700">(pendiente)</span></td>
                  <td class="td font-semibold" x-text="i.ultimo ? fmt(i.ultimo.resultado, i.unidad, i.decimales) : '—'"></td><td class="td" x-text="umbralTxt(i)"></td>
                  <td class="td"><span x-show="i.ultimo" class="chip border-transparent text-white" :class="semBg(i.ultimo && i.ultimo.semaforo)" x-text="semTxt(i.ultimo && i.ultimo.semaforo)"></span> <button class="btn btn-s btn-sm ml-1" @click.stop="verFicha(i.id)">Ficha</button></td>
                </tr></template></tbody></table>
          </div>
          <div class="divide-y divide-slate-100 md:hidden">
            <template x-for="i in dash.indicadores" :key="i.id">
              <button class="flex w-full items-center gap-3 p-4 text-left" @click="verTendencia(i)">
                <span class="h-10 w-1.5 shrink-0 rounded-full" :class="i.ultimo ? semBg(i.ultimo.semaforo) : 'bg-slate-300'"></span>
                <span class="min-w-0 flex-1"><span class="block text-xs text-slate-500" x-text="i.codigo + ' · ' + i.area"></span><span class="block truncate text-sm font-semibold" x-text="i.nombre"></span><span class="block text-xs text-slate-500" x-text="(i.ultimo ? i.ultimo.etiqueta : 'Sin datos') + (i.pendiente ? ' · carga pendiente' : '')"></span></span>
                <span class="text-right"><span class="block font-bold" x-text="i.ultimo ? fmt(i.ultimo.resultado, i.unidad, i.decimales) : '—'"></span><span class="block text-[11px] text-slate-500" x-text="umbralTxt(i)"></span></span>
              </button>
            </template>
          </div>
        </div>
      </div>
      </template>
    </section>

    <!-- ============ FICHAS ============ -->

        <button class="btn btn-p w-full sm:w-auto" @click="nuevaFicha()" :disabled="!areas.length">+ Nuevo indicador</button>
      </div>
      <template x-if="!setup().completo"><div class="card border-sky-300 bg-sky-50"><div class="card-b space-y-2">
        <div class="font-semibold text-sky-900">Configuración inicial</div>
        <template x-for="p in setup().pasos" :key="p.t"><button class="flex w-full items-center gap-3 rounded-lg bg-white px-3 py-2.5 text-left text-sm" @click="go(p.v)"><span class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold text-white" :class="p.ok ? 'bg-green-600' : 'bg-slate-400'" x-text="p.ok ? '✓' : p.n"></span><span class="flex-1" x-text="p.t"></span><span class="text-brand">Ir →</span></button></template>
      </div></div></template>
      <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-4" x-show="indicadores.length">
        <input class="inp lg:col-span-1" type="search" x-model="fq.q" placeholder="Buscar código, nombre o área" aria-label="Buscar">
        <select class="inp" x-model="fq.area" aria-label="Área"><option value="">Todas las áreas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select>
        <select class="inp" x-model="fq.frecuencia" aria-label="Frecuencia"><option value="">Toda frecuencia</option><option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="semestral">Semestral</option></select>
        <select class="inp" x-model="fq.estado" aria-label="Estado"><option value="activo">Activos</option><option value="archivado">Archivados</option><option value="">Todos</option></select>
      </div>
      <p class="text-xs text-slate-500" x-show="indicadores.length" x-text="fichasFiltradas.length + ' de ' + indicadores.length + ' indicadores'"></p>
      <div class="card p-10 text-center text-sm text-slate-500" x-show="setup().completo && !fichasFiltradas.length">No hay indicadores que coincidan. Cree uno con «Nuevo indicador» o ajuste los filtros.</div>
      <div class="hidden md:block" x-show="fichasFiltradas.length"><div class="card overflow-x-auto">
        <table class="w-full"><thead><tr><th class="th">Código</th><th class="th">Indicador</th><th class="th">Área</th><th class="th">Frecuencia</th><th class="th">Meta / Límite</th><th class="th">Cargas</th><th class="th"></th></tr></thead>
          <tbody><template x-for="i in fichasFiltradas" :key="i.id"><tr :class="!i.activo && 'bg-slate-50 text-slate-500'">
            <td class="td font-semibold" x-text="i.codigo"></td>
            <td class="td"><div class="font-medium" x-text="i.nombre"></div><div class="font-mono text-xs text-slate-500" x-text="i.formula"></div><span class="chip mt-1 border-slate-300 text-slate-600" x-show="!i.activo">Archivado</span></td>
            <td class="td" x-text="i.area"></td><td class="td" x-text="cap(i.frecuencia) + ' · ' + i.unidad"></td>
            <td class="td whitespace-nowrap" x-text="umbralTxt(i)"></td><td class="td" x-text="i.n_mediciones"></td>
            <td class="td whitespace-nowrap text-right"><div class="flex justify-end gap-1">
              <button class="btn btn-s btn-sm" @click="verFicha(i.id)">Ver ficha</button><button class="btn btn-s btn-sm" @click="editarFicha(i)">Editar</button><button class="btn btn-s btn-sm" @click="duplicarFicha(i)">Duplicar</button>
              <button class="btn btn-s btn-sm" @click="alternarActivo(i)" x-text="i.activo ? 'Archivar' : 'Restaurar'"></button><button class="btn btn-d btn-sm" @click="eliminarFicha(i)">Eliminar</button></div></td></tr></template></tbody></table>
      </div></div>
      <div class="space-y-3 md:hidden">
        <template x-for="i in fichasFiltradas" :key="'m'+i.id"><div class="card" :class="!i.activo && 'bg-slate-50'"><div class="card-b space-y-2">
          <div class="flex items-start justify-between gap-2"><div><div class="text-xs text-slate-500" x-text="i.codigo + ' · ' + i.area"></div><div class="font-semibold" x-text="i.nombre"></div></div><span class="chip border-slate-300 text-slate-600" x-text="i.activo ? i.n_mediciones + ' cargas' : 'Archivado'"></span></div>
          <div class="text-xs text-slate-500" x-text="cap(i.frecuencia) + ' · ' + i.unidad + ' · ' + umbralTxt(i)"></div>
          <div class="grid grid-cols-2 gap-2 pt-1"><button class="btn btn-s btn-sm col-span-2" @click="verFicha(i.id)">Ver ficha técnica</button><button class="btn btn-s btn-sm" @click="editarFicha(i)">Editar</button><button class="btn btn-s btn-sm" @click="duplicarFicha(i)">Duplicar</button>
            <button class="btn btn-s btn-sm" @click="alternarActivo(i)" x-text="i.activo ? 'Archivar' : 'Restaurar'"></button><button class="btn btn-d btn-sm" @click="eliminarFicha(i)">Eliminar</button></div>
        </div></div></template>
      </div>
    </section>

    <!-- ============ ORGANIZACIÓN ============ -->
    <section x-show="view==='org'" class="space-y-4">
      <div><h1 class="text-2xl font-bold">Organización</h1><p class="text-sm text-slate-600">Áreas de la empresa y usuarios con acceso al sistema.</p></div>
      <div class="grid gap-4 lg:grid-cols-5">
        <div class="card lg:col-span-2 self-start">
          <div class="card-h"><h2 class="font-semibold">Áreas</h2><span class="text-xs text-slate-500" x-text="areas.length"></span></div>
          <div class="card-b space-y-3">
            <form class="flex gap-2" @submit.prevent="guardarArea()">
              <input class="inp" x-model="areaForm.nombre" :placeholder="areaForm.id ? 'Renombrar área' : 'Nueva área (ej. Producción)'" required minlength="2">

              <button type="button" class="btn btn-s" x-show="areaForm.id" @click="areaForm={id:null,nombre:''}">✕</button>
            </form>
            <ul class="divide-y divide-slate-100">
              <template x-for="a in areas" :key="a.id"><li class="flex items-center justify-between gap-2 py-2.5"><span class="text-sm font-medium" x-text="a.nombre"></span>
                <span class="flex gap-1"><button class="btn btn-s btn-sm" @click="areaForm={id:a.id,nombre:a.nombre}">Editar</button><button class="btn btn-d btn-sm" @click="eliminarArea(a)">Eliminar</button></span></li></template>
            </ul>
            <p class="py-4 text-center text-sm text-slate-500" x-show="!areas.length">Cree primero las áreas de la empresa.</p>
          </div>
        </div>
        <div class="card lg:col-span-3 self-start">
          <div class="card-h"><h2 class="font-semibold">Usuarios</h2><button class="btn btn-p btn-sm" @click="nuevoUsuario()">+ Nuevo usuario</button></div>
          <ul class="divide-y divide-slate-100">
            <template x-for="x in usuarios" :key="x.id"><li class="flex items-center gap-3 p-4" :class="!x.activo && 'opacity-50'">
              <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-100 text-sm font-bold text-slate-600" x-text="iniciales(x)"></span>
              <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold" x-text="x.nombre"></span><span class="block truncate text-xs text-slate-500" x-text="x.username + ' · ' + rolNombre(x) + (x.area ? ' · ' + x.area : '') + (x.activo ? '' : ' · inactivo')"></span></span>
              <button class="btn btn-s btn-sm" @click="editarUsuario(x)">Editar</button>
            </li></template>
          </ul>
        </div>
      </div>
    
      <div class="grid gap-4 lg:grid-cols-2">
        <div class="card self-start"><div class="card-h"><h2 class="font-semibold">Parámetros del sistema</h2></div>
          <form class="card-b space-y-3" @submit.prevent="guardarParametros()">
            <div><label class="lbl">Empresa</label><input class="inp" x-model="parForm.empresa" required maxlength="120"></div>
            <div><label class="lbl">Gerencia emisora de las fichas</label><input class="inp" x-model="parForm.gerencia_emisora" maxlength="150"></div>
            <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl">Código del formato</label><input class="inp" x-model="parForm.codigo_formato" maxlength="30" placeholder="NC-16-7"></div>
              <div><label class="lbl flex items-center gap-1.5">Inicio del ejercicio fiscal<button type="button" class="info" @click="toggleAyuda('ejercicio')" aria-label="Ayuda">i</button></label><select class="inp" x-model.number="parForm.ejercicio_inicio"><template x-for="(m,k) in ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']" :key="k"><option :value="k+1" x-text="m"></option></template></select></div></div>
            <div class="ayuda" x-show="ay==='ejercicio'">Mes en que comienza el año de gestión. Con inicio en <b>Octubre</b>, el ejercicio 2025-2026 va de octubre 2025 a septiembre 2026 y los trimestres cierran en Dic., Mar., Jun. y Sep. No puede cambiarse cuando ya hay cargas no mensuales.</div>
            <p class="text-xs text-slate-500">Ejercicio vigente: <b x-text="params.ejercicio_actual"></b></p>
            <button class="btn btn-p" :disabled="busy">Guardar parámetros</button>
          </form></div>
        <div class="card self-start"><div class="card-h"><h2 class="font-semibold">Listas de apoyo de la ficha</h2></div>
          <div class="card-b space-y-3">
            <div class="flex flex-wrap gap-1"><template x-for="t in [['proceso','Procesos'],['objetivo','Objetivos'],['gerencia','Gerencias'],['cargo','Cargos']]" :key="t[0]"><button class="btn btn-sm" :class="catTab===t[0] ? 'btn-p' : 'btn-s'" @click="catTab=t[0]; catForm={id:null,valor:'',detalle:''}" x-text="t[1] + ' (' + lista(t[0]).length + ')'"></button></template></div>
            <form class="space-y-2" @submit.prevent="guardarCat()"><input class="inp" x-model="catForm.valor" required minlength="2" :placeholder="catForm.id ? 'Editar elemento' : 'Nuevo elemento'">
              <textarea class="inp" rows="2" x-model="catForm.detalle" x-show="catTab==='proceso'" placeholder="Objetivo del proceso (se copia a la ficha al elegirlo)"></textarea>
              <div class="flex gap-2"><button class="btn btn-p btn-sm" :disabled="busy" x-text="catForm.id ? 'Guardar' : 'Agregar'"></button><button type="button" class="btn btn-s btn-sm" x-show="catForm.id" @click="catForm={id:null,valor:'',detalle:''}">Cancelar</button></div></form>
            <ul class="max-h-72 divide-y divide-slate-100 overflow-y-auto"><template x-for="c in catActual" :key="c.id"><li class="flex items-center justify-between gap-2 py-2"><span class="min-w-0 text-sm"><span class="block truncate" x-text="c.valor"></span><span class="block truncate text-xs text-slate-500" x-show="c.detalle" x-text="c.detalle"></span></span>
              <span class="flex shrink-0 gap-1"><button class="btn btn-s btn-sm" @click="catForm={id:c.id,valor:c.valor,detalle:c.detalle}">Editar</button><button class="btn btn-d btn-sm" @click="eliminarCat(c)">Quitar</button></span></li></template></ul>
            <p class="py-3 text-center text-sm text-slate-500" x-show="!catActual.length">Lista vacía. También puede cargarla desde <b>Importar</b>.</p>
          </div></div>
      </div>
    </section>

    <!-- ============ REPORTES ============ -->
    <section x-show="view==='reportes'" class="mx-auto max-w-3xl space-y-4">
      <div><h1 class="text-2xl font-bold">Reportes</h1><p class="text-sm text-slate-600" x-text="user.rol==='jefe' ? 'Descargue en Excel las cargas y fichas de su área.' : 'Descargue en Excel el informe de gestión con formato listo para presentar o imprimir.'"></p></div>
      <div class="card"><div class="card-h"><h2 class="font-semibold">Informe de indicadores de gestión</h2><span class="chip border-green-300 bg-green-50 text-green-800">Excel .xlsx</span></div>
        <div class="card-b space-y-4">
          <div class="grid gap-3 sm:grid-cols-3">
            <div><label class="lbl">Ejercicio fiscal</label><select class="inp" x-model="rep.anio"><option value="">Todos los ejercicios</option><template x-for="e in ejercicios" :key="e.valor"><option :value="e.valor" x-text="e.etiqueta"></option></template></select></div>
            <div x-show="user.rol!=='jefe'"><label class="lbl">Área</label><select class="inp" x-model="rep.area_id"><option value="">Todas las áreas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select></div>
            <div><label class="lbl">Estado de la carga</label><select class="inp" x-model="rep.estado"><option value="">Todos</option><option value="aprobado">Aprobadas</option><option value="enviado">En revisión</option><option value="observado">Devueltas</option></select></div>
          </div>
          <button class="btn btn-p w-full sm:w-auto" :disabled="busy" @click="descargarReporte()"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path :d="icono('reportes')"/></svg><span x-text="busy ? 'Generando…' : 'Descargar reporte Excel'"></span></button>
          <div class="rounded-lg bg-slate-50 p-3 text-sm text-slate-700"><div class="mb-1 font-semibold">El archivo incluye 5 hojas:</div>
            <ul class="space-y-1"><li><b>Resumen</b> — indicadores clave, cumplimiento por departamento y gráfico.</li><li><b>Mediciones</b> — todas las cargas con semáforo, estado, responsables, análisis y plan.</li><li><b>Tendencias</b> — matriz indicador × período con colores de semáforo.</li><li><b>Plan de mejora</b> — desviaciones y acciones correctivas (ISO 9001, 9.1.3 y 10.2).</li><li><b>Fichas técnicas</b> — fórmula, variables, metas y fuente de cada indicador.</li></ul></div>
        </div></div>
    </section>

    <section x-show="view==='reportes'" class="mx-auto max-w-3xl space-y-4" style="margin-top:-0.5rem">
      <div class="card"><div class="card-h"><h2 class="font-semibold">Fichas técnicas (formato SGC)</h2><span class="chip border-green-300 bg-green-50 text-green-800">Excel .xlsx</span></div>
        <div class="card-b space-y-4">
          <p class="text-sm text-slate-700">Una hoja por indicador con el mismo diseño de la ficha en papel: definición, semáforo, responsables, resultados por período del ejercicio fiscal, gráfico y análisis. Usa el <b>ejercicio fiscal</b> elegido arriba (o el vigente).</p>
          <div class="grid gap-3 sm:grid-cols-2"><div x-show="user.rol!=='jefe'"><label class="lbl">Área</label><select class="inp" x-model="repFicha.area_id"><option value="">Todas las áreas</option><template x-for="a in areas" :key="a.id"><option :value="a.id" x-text="a.nombre"></option></template></select></div>
            <div><label class="lbl">Indicador</label><select class="inp" x-model="repFicha.indicador_id"><option value="">Todos</option><template x-for="i in indicadores.filter(i => !repFicha.area_id || i.area_id==repFicha.area_id)" :key="i.id"><option :value="i.id" x-text="i.codigo + ' · ' + i.nombre"></option></template></select></div></div>
          <button class="btn btn-p w-full sm:w-auto" :disabled="busy" @click="descargarFichas()">Descargar fichas en Excel</button>
        </div></div>
    </section>

    <!-- ============ FICHA TÉCNICA ============ -->
    <section x-show="view==='ficha'" class="space-y-4">
      <template x-if="fv.data">
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button class="btn btn-s btn-sm" @click="go(fv.volver || (user.rol==='admin' ? 'fichas' : 'historial'))">← Volver</button>
            <div class="flex flex-wrap gap-2">
