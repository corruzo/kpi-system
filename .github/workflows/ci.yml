name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, pruebas (SQLite) y migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Pruebas
        run: pytest -q
      - name: Migraciones desde cero y sin diferencias con los modelos
        env: { SIGT_DATA_DIR: "${{ runner.temp }}/migraciones" }
        run: |
          mkdir -p "$SIGT_DATA_DIR"
          alembic upgrade head
          alembic check

  postgres:
    name: Pruebas contra PostgreSQL (como Supabase)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: sigt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIGT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/sigt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migraciones
        run: alembic upgrade head && alembic check
      - name: Pruebas
        run: pytest -q

  css:
    name: El CSS compilado está al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:css
      - name: Sin cambios pendientes en app/static/tailwind.css
        run: git diff --exit-code app/static/tailwind.css

  dependencias:
    name: Vulnerabilidades conocidas en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --strict
